<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Spotify Lyrics Overlay</title>

    <style>
        /* ==================================================
           FONTS
        ================================================== */

        @import url(
            'https://fonts.googleapis.com/css2?family=Sora:wght@700&family=Spline+Sans:wght@700&display=swap'
        );


        /* ==================================================
           GLOBAL
        ================================================== */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;

            background: #07080b;

            font-family:
                "Spline Sans",
                Arial,
                Helvetica,
                sans-serif;

            color: white;

            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;

            text-rendering: optimizeLegibility;

            cursor: none;
        }

        body {
            transition:
                background-color 1.2s ease;
        }

        #app {
            position: fixed;
            inset: 0;

            overflow: hidden;

            background: #07080b;

            transition:
                background 1.2s ease;
        }


        /* ==================================================
           AMBIENT BACKGROUND
        ================================================== */

        .ambient {
            position: fixed;
            inset: -25%;

            pointer-events: none;

            z-index: 0;

            background:
                radial-gradient(
                    circle at 25% 50%,
                    var(--ambient-color-soft),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 75% 50%,
                    var(--ambient-color-faint),
                    transparent 40%
                );

            filter: blur(70px);

            opacity: .75;

            transition:
                background 1.4s ease,
                opacity 1.2s ease;
        }

        .ambient::after {
            content: "";

            position: absolute;
            inset: 20%;

            border-radius: 50%;

            background:
                var(--ambient-color-center);

            filter: blur(90px);

            opacity: .5;
        }


        /* ==================================================
           MAIN SCENE
        ================================================== */

        .scene {
            position: relative;

            z-index: 1;

            width: 100%;
            height: 100%;

            display: grid;
            place-items: center;

            padding: 30px;
        }


        /* ==================================================
           GLASS CONTAINER
        ================================================== */

        .glass {
            position: relative;

            width:
                min(1180px, 94vw);

            min-height:
                560px;

            padding:
                55px 70px;

            border-radius:
                42px;

            background:
                linear-gradient(
                    135deg,
                    var(--glass-color-primary),
                    var(--glass-color-secondary)
                );

            border:
                1px solid
                var(--glass-border-color);

            backdrop-filter:
                blur(18px);

            -webkit-backdrop-filter:
                blur(18px);

            box-shadow:
                inset
                0 1px
                rgba(255, 255, 255, .055),

                0 35px 100px
                rgba(0, 0, 0, .45),

                0 0 45px
                var(--glass-outer-glow);

            overflow:
                hidden;

            transition:
                background 1.4s ease,
                border-color 1.4s ease,
                box-shadow 1.4s ease;
        }


        /* ==================================================
           GLASS AMBIENT COLOR
        ================================================== */

        .glass::before {
            content: "";

            position: absolute;

            width:
                520px;

            height:
                520px;

            left:
                24%;

            top:
                50%;

            transform:
                translate(
                    -50%,
                    -50%
                );

            border-radius:
                50%;

            background:
                var(--ambient-color-glass);

            filter:
                blur(90px);

            opacity:
                .28;

            pointer-events:
                none;
        }


        /* ==================================================
           GLASS BORDER TRACE
        ================================================== */

        .glass::after {
            content: "";

            position: absolute;

            inset: 0;

            z-index: 1;

            border-radius:
                inherit;

            padding:
                1px;

            background:
                conic-gradient(
                    from var(--trace-angle),

                    transparent 0deg 315deg,

                    var(--glass-trace-soft) 330deg,

                    var(--glass-trace-medium) 342deg,

                    var(--glass-trace-bright) 350deg,

                    rgba(255, 255, 255, .95) 356deg,

                    transparent 360deg
                );

            -webkit-mask:
                linear-gradient(#000 0 0) content-box,
                linear-gradient(#000 0 0);

            -webkit-mask-composite:
                xor;

            mask:
                linear-gradient(#000 0 0) content-box,
                linear-gradient(#000 0 0);

            mask-composite:
                exclude;

            filter:
                drop-shadow(
                    0 0 4px
                    var(--glass-trace-glow)
                )
                drop-shadow(
                    0 0 10px
                    var(--glass-trace-glow)
                );

            pointer-events:
                none;

            animation:
                traceBorder
                8s
                linear
                infinite;
        }


        /* ==================================================
           TRACE ANGLE
        ================================================== */

        @property --trace-angle {
            syntax: "<angle>";
            inherits: false;
            initial-value: 0deg;
        }

        @keyframes traceBorder {
            to {
                --trace-angle:
                    360deg;
            }
        }


        /* ==================================================
           GLASS TOP HIGHLIGHT
        ================================================== */

        .highlight {
            position: absolute;

            top: 0;
            left: 12%;

            width: 76%;
            height: 1px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,.12),
                    transparent
                );
        }


        /* ==================================================
           CONTENT
        ================================================== */

        .content {
            position: relative;

            z-index: 2;

            width: 100%;

            min-height:
                450px;

            display: grid;

            grid-template-columns:
                310px
                minmax(0, 1fr);

            align-items:
                center;

            column-gap:
                55px;
        }


        /* ==================================================
           VINYL SIDE
        ================================================== */

        .vinyl-area {
            display: flex;

            flex-direction:
                column;

            align-items:
                center;

            justify-content:
                center;

            margin-left:
                0;

            perspective:
                850px;

            animation:
                vinylFloat
                6s
                ease-in-out
                infinite;
        }

        @keyframes vinylFloat {
            0%,
            100% {
                transform:
                    translateY(0);
            }

            50% {
                transform:
                    translateY(-8px);
            }
        }


        /* ==================================================
           VINYL
        ================================================== */

        .record {
            position: relative;

            width:
                clamp(
                    210px,
                    34vw,
                    480px
                );

            margin-left:
                35%;

            transform-style:
                preserve-3d;

            transform:
                rotateX(18deg)
                rotateY(-20deg)
                rotateZ(-8deg);

            aspect-ratio:
                1;

            flex:
                0 0 auto;

            border-radius:
                50%;

            background:
                radial-gradient(
                    circle at 29% 22%,
                    rgba(255,255,255,.22),
                    transparent 16%
                ),

                radial-gradient(
                    circle at 70% 76%,
                    transparent 0 46%,
                    rgba(0,0,0,.72) 78%,
                    rgba(255,255,255,.10) 96%,
                    #08090b 100%
                ),

                repeating-radial-gradient(
                    circle,
                    #090a0c 0 1px,
                    #30343a 1.3px 1.8px,
                    #111317 2.2px 3.8px
                ),

                #171a1e;

            animation:
                spin
                28s
                linear
                infinite;
        }

        .record::before {
            content: "";

            position: absolute;

            inset:
                -3%;

            z-index:
                -1;

            border-radius:
                50%;

            border:
                2px solid
                var(--ambient-color-art);

            box-shadow:
                0 0 12px
                var(--ambient-color-art),

                inset 0 0 8px
                rgba(255,255,255,.12);

            opacity:
                .72;

            pointer-events:
                none;
        }

        .record::after {
            content: "";

            position: absolute;

            inset:
                2.5%;

            border-radius:
                50%;

            border:
                1px solid
                rgba(220,225,230,.32);

            box-shadow:
                inset 0 0 10px
                rgba(255,255,255,.13),

                0 0 8px
                rgba(255,255,255,.10);

            pointer-events:
                none;
        }


        /* ==================================================
           ALBUM ART
        ================================================== */

        .album {
            position: absolute;

            inset:
                13%;

            border-radius:
                50%;

            overflow:
                hidden;

            background:
                linear-gradient(
                    135deg,
                    #25262a,
                    #111216
                );

            box-shadow:
                0 0 0 1px
                rgba(255,255,255,.16),

                0 0 25px
                var(--ambient-color-art),

                inset
                0 0 20px
                rgba(0,0,0,.35);

            transform:
                translateZ(5px);

            transition:
                box-shadow 1.2s ease;
        }


        /* ==================================================
           ALBUM ART IMAGE
        ================================================== */

        #albumArt {
            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;

            border-radius:
                50%;

            opacity: 0;

            transform:
                scale(1.01);

            transition:
                opacity .8s ease,
                transform .8s ease;
        }

        #albumArt.loaded {
            opacity: 1;

            transform:
                scale(1);
        }


        /* ==================================================
           ALBUM ART GLASS HIGHLIGHT
        ================================================== */

        .album::after {
            content: "";

            position: absolute;

            inset: 0;

            border-radius:
                50%;

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,.24),
                    transparent 32%,
                    transparent 68%,
                    rgba(0,0,0,.18)
                );

            mix-blend-mode:
                screen;

            pointer-events:
                none;
        }


        /* ==================================================
           VINYL CENTER HOLE
        ================================================== */

        .hole {
            position: absolute;

            z-index: 5;

            width:
                30px;

            height:
                30px;

            border-radius:
                50%;

            left:
                50%;

            top:
                50%;

            transform:
                translate(
                    -50%,
                    -50%
                );

            background:
                radial-gradient(
                    circle at center,
                    #bfc2c6 0 30%,
                    #5f6368 32% 100%
                );

            box-shadow:
                0 0 0 2px
                rgba(0,0,0,.45),

                0 0 7px
                rgba(255,255,255,.15);
        }


        /* ==================================================
           VINYL ROTATION
        ================================================== */

        @keyframes spin {
            from {
                transform:
                    rotateX(18deg)
                    rotateY(-20deg)
                    rotateZ(-8deg);
            }

            to {
                transform:
                    rotateX(18deg)
                    rotateY(-20deg)
                    rotateZ(352deg);
            }
        }


        /* ==================================================
           NOW PLAYING
        ================================================== */

        .now-playing {
            margin-bottom:
                24px;

            text-align:
                left;

            width:
                100%;

            max-width:
                560px;
        }

        .now-playing h1 {
            margin:
                0;

            text-align:
                left;
        }

        .now-playing-label {
            margin-bottom:
                12px;

            margin-left:
                0;

            font-family:
                "Spline Sans",
                sans-serif;

            font-size:
                10px;

            line-height:
                1.2;

            font-weight:
                700;

            letter-spacing:
                .16em;

            text-transform:
                uppercase;

            color:
                rgba(255,255,255,.38);

            text-align:
                left;
        }


        /* ==================================================
           SONG TITLE
        ================================================== */

        #title {
            margin:
                0;

            max-width:
                560px;

            font-family:
                "Sora",
                Arial,
                sans-serif;

            font-size:
                clamp(
                    50px,
                    3.2vw,
                    44px
                );

            line-height:
                1.12;

            font-weight:
                700;

            letter-spacing:
                -.035em;

            color:
                rgba(255,255,255,.90);

            text-align:
                left;

            text-wrap:
                balance;

            overflow-wrap:
                anywhere;

            text-shadow:
                none;

            transition:
                opacity .35s ease,
                transform .35s ease;
        }


        /* ==================================================
           LYRICS AREA

           24% LEFT PADDING PRESERVED.
        ================================================== */

        .lyrics-area {
            min-width:
                0;

            width:
                100%;

            display:
                flex;

            flex-direction:
                column;

            justify-content:
                center;

            align-items:
                flex-start;

            margin-left:
                0;

            padding-left:
                24%;
        }


        /* ==================================================
           LYRICS OVERLAY
        ================================================== */

        #overlay {
            position:
                relative;

            width:
                100%;

            max-width:
                560px;

            opacity:
                0;

            transition:
                opacity .5s ease;
        }

        #overlay.visible {
            opacity:
                1;
        }

        #overlay.harmonizing {
            opacity:
                0;
        }


        /* ==================================================
           LYRICS VIEWPORT

           Only the current lyric and the next two
           lyrics are visually used.

           Previous lyrics are completely hidden.
        ================================================== */

        .roller-viewport {
            position:
                relative;

            width:
                100%;

            height:
                340px;

            overflow:
                hidden;

            -webkit-mask-image:
                linear-gradient(
                    to bottom,
                    transparent 0%,
                    black 12%,
                    black 90%,
                    transparent 100%
                );

            mask-image:
                linear-gradient(
                    to bottom,
                    transparent 0%,
                    black 12%,
                    black 90%,
                    transparent 100%
                );
        }


        /* ==================================================
           LYRICS TRACK
        ================================================== */

        #lyrics {
            position:
                absolute;

            left:
                0;

            right:
                auto;

            top:
                0;

            width:
                100%;

            transition:
                transform .55s
                cubic-bezier(
                    .22,
                    1,
                    .36,
                    1
                );

            will-change:
                transform;
        }


        /* ==================================================
           LYRIC LINE BASE
        ================================================== */

        .lyric-line {
            width:
                100%;

            max-width:
                560px;

            display:
                block;

            overflow:
                visible;

            text-align:
                left;

            text-wrap:
                pretty;

            overflow-wrap:
                break-word;

            font-family:
                "Spline Sans",
                Arial,
                sans-serif;

            font-size:
                20px;

            line-height:
                1.25;

            font-weight:
                700;

            letter-spacing:
                -.012em;

            color:
                rgba(255,255,255,.10);

            text-shadow:
                none;

            transform:
                none;

            opacity:
                0;

            /*
               Important:

               Lines that are not current or next
               do not take up visual space.
            */

            display:
                none;

            transition:
                opacity .35s ease,
                color .20s ease,
                font-size .35s cubic-bezier(
                    .22,
                    1,
                    .36,
                    1
                ),
                line-height .35s ease,
                margin .35s ease;
        }


        /* ==================================================
           CURRENT LYRIC

           This is now the MAIN lyric position.

           Extra bottom margin creates clear separation
           between the large current lyric and next lyric.
        ================================================== */

        .lyric-line.current {
            display:
                block;

            opacity:
                1;

            font-size:
                44px;

            line-height:
                1.20;

            font-weight:
                700;

            letter-spacing:
                -.014em;

            color:
                rgba(255,255,255,.30);

            background:
                none;

            /*
               This creates the requested space below
               the current lyric.
            */

            margin-bottom:
                38px;

            padding-bottom:
                8px;

            -webkit-text-fill-color:
                initial;
        }


        /* ==================================================
           NEXT LYRIC 1

           Immediately below current lyric.
        ================================================== */

        .lyric-line.next-1 {
            display:
                block;

            opacity:
                .16;

            font-size:
                22px;

            line-height:
                1.25;

            margin-bottom:
                28px;

            color:
                rgba(255,255,255,.22);

            transform:
                none;
        }


        /* ==================================================
           NEXT LYRIC 2

           Further below next lyric 1.
        ================================================== */

        .lyric-line.next-2 {
            display:
                block;

            opacity:
                .08;

            font-size:
                20px;

            line-height:
                1.25;

            margin-bottom:
                0;

            color:
                rgba(255,255,255,.14);

            transform:
                none;
        }


        /* ==================================================
           HIDDEN LINES

           Previous lyrics and all lines outside the
           visible 3-line window are completely removed
           from layout.
        ================================================== */

        .lyric-line.hidden,
        .lyric-line.prev-1,
        .lyric-line.prev-2 {
            display:
                none;

            opacity:
                0;

            visibility:
                hidden;

            pointer-events:
                none;

            height:
                0;

            margin:
                0;

            padding:
                0;
        }


        /* ==================================================
           KARAOKE SENTENCES
        ================================================== */

        .lyric-sentence {
            display:
                inline;
        }


        /* ==================================================
           KARAOKE WORDS
        ================================================== */

        .lyric-word {
            display:
                inline;

            color:
                rgba(255,255,255,.30);

            transition:
                color .14s linear,
                opacity .14s linear;
        }

        .lyric-word.active {
            color:
                rgba(255,255,255,.99);
        }


        /* ==================================================
           LOADING
        ================================================== */

        #loading {
            display:
                none;

            margin-top:
                8px;

            text-align:
                left;

            font-family:
                "Spline Sans",
                sans-serif;

            font-size:
                14px;

            color:
                rgba(255,255,255,.45);
        }


        /* ==================================================
           NO LYRICS
        ================================================== */

        #noLyrics {
            display:
                none;

            text-align:
                left;

            font-family:
                "Spline Sans",
                sans-serif;

            font-size:
                20px;

            color:
                rgba(255,255,255,.5);
        }


        /* ==================================================
           SONG CHANGE
        ================================================== */

        @keyframes songChange {
            0% {
                opacity:
                    0;

                transform:
                    translateY(15px);
            }

            100% {
                opacity:
                    1;

                transform:
                    translateY(0);
            }
        }

        .song-change {
            animation:
                songChange .7s
                cubic-bezier(
                    .22,
                    1,
                    .36,
                    1
                );
        }


        /* ==================================================
           MOBILE
        ================================================== */

        @media (max-width: 800px) {

            .scene {
                display:
                    flex;

                flex-direction:
                    column;

                justify-content:
                    flex-start;

                overflow-y:
                    auto;

                gap:
                    20px;

                width:
                    100%;

                padding:
                    16px;
            }

            .glass {
                width:
                    95vw;

                min-height:
                    250px;

                padding:
                    42px 25px;

                border-radius:
                    32px;
            }

            .content {
                min-height:
                    250px;
            }

            .record {
                width:
                    175px;
            }

            .vinyl-area {
                order:
                    1;
            }

            .lyrics-area {
                width:
                    100%;

                order:
                    2;

                padding-left:
                    0;
            }

            .now-playing {
                margin-bottom:
                    20px;

                text-align:
                    left;

                max-width:
                    100%;
            }

            .now-playing-label {
                margin-left:
                    0;
            }

            #title {
                font-size:
                    50px;

                max-width:
                    100%;
            }

            .roller-viewport {
                height:
                    270px;
            }

            .lyric-line.current {
                font-size:
                    25px;

                line-height:
                    1.2;

                margin-bottom:
                    28px;

                padding-bottom:
                    6px;
            }

            .lyric-line.next-1 {
                font-size:
                    19px;

                margin-bottom:
                    22px;
            }

            .lyric-line.next-2 {
                font-size:
                    18px;
            }
        }


        /* ==================================================
           VERY SMALL SCREENS
        ================================================== */

        @media (max-width: 500px) {

            .glass {
                padding:
                    30px 18px;
            }

            .record {
                width:
                    145px;
            }

            #title {
                font-size:
                    27px;
            }

            .roller-viewport {
                height:
                    240px;
            }

            .lyric-line.current {
                font-size:
                    22px;

                margin-bottom:
                    24px;

                padding-bottom:
                    5px;
            }

            .lyric-line.next-1 {
                font-size:
                    18px;

                margin-bottom:
                    18px;
            }

            .lyric-line.next-2 {
                font-size:
                    17px;
            }
        }
    </style>
</head>


<body>

<div id="app">

    <div
        class="ambient"
        id="ambient"
    ></div>


    <main class="scene">

        <section class="glass">

            <div class="highlight"></div>


            <div class="content">


                <!-- ======================================
                     VINYL
                ======================================= -->

                <div class="vinyl-area">

                    <div
                        class="record"
                        id="record"
                    >

                        <div
                            class="album"
                            id="album"
                        >

                            <img
                                id="albumArt"
                                alt=""
                            >

                        </div>


                        <div class="hole"></div>

                    </div>

                </div>


                <!-- ======================================
                     LYRICS SIDE
                ======================================= -->

                <div class="lyrics-area">


                    <!-- ==================================
                         NOW PLAYING
                    =================================== -->

                    <div class="now-playing">

                        <div
                            class="now-playing-label"
                        >
                            Now Playing
                        </div>


                        <h1 id="title">
                            Waiting for Spotify...
                        </h1>

                    </div>


                    <!-- ==================================
                         LYRICS
                    =================================== -->

                    <div id="overlay">

                        <div
                            class="roller-viewport"
                        >

                            <div
                                id="lyrics"
                            ></div>

                        </div>


                        <div id="loading">
                            Loading lyrics...
                        </div>


                        <div id="noLyrics">
                            Lyrics unavailable
                        </div>

                    </div>

                </div>

            </div>

        </section>

    </main>

</div>


<script>

    /* ==================================================
       STATE
    ================================================== */

    let currentTrackId = null;

    let currentLyrics = [];

    let lineElements = [];

    let lastServerPosition = 0;

    let lastServerSyncTime = 0;

    let lastLyricIndex = undefined;

    let lyricsRequestTrack = null;

    let lyricsRequestVersion = 0;

    let harmonizing = false;

    let lastTransition = null;

    let currentAlbumArt = null;

    let isPlaybackActive = false;


    /* ==================================================
       SETTINGS
    ================================================== */

    /*
       Height used by the JavaScript positioning system.

       The visual layout is now:

       CURRENT
          ↓
       NEXT 1
          ↓
       NEXT 2
    */

    const CURRENT_OFFSET = 0;

    const NEXT_1_OFFSET = 1;

    const NEXT_2_OFFSET = 2;


    const HARMONIZE_HIDE_TIME = 900;


    /*
       Small anticipation compensates for:

       - browser rendering latency
       - Spotify position sampling
       - animation/rendering delay

       Keep this small.
    */

    const KARAOKE_LEAD = 70;


    /* ==================================================

    /* ==================================================
       ALBUM COLOR
    ================================================== */

    function updateAmbientFromImage(image) {

        try {

            const canvas =
                document.createElement(
                    "canvas"
                );

            const context =
                canvas.getContext(
                    "2d",
                    {
                        willReadFrequently:
                            true
                    }
                );

            const sampleSize = 32;

            canvas.width =
                sampleSize;

            canvas.height =
                sampleSize;


            context.drawImage(
                image,
                0,
                0,
                sampleSize,
                sampleSize
            );


            const pixels =
                context.getImageData(
                    0,
                    0,
                    sampleSize,
                    sampleSize
                ).data;


            let red = 0;

            let green = 0;

            let blue = 0;

            let count = 0;


            for (
                let i = 0;
                i < pixels.length;
                i += 4
            ) {

                const r =
                    pixels[i];

                const g =
                    pixels[i + 1];

                const b =
                    pixels[i + 2];

                const alpha =
                    pixels[i + 3];


                if (
                    alpha < 40
                ) {
                    continue;
                }


                const brightness =
                    (
                        r +
                        g +
                        b
                    ) / 3;


                if (
                    brightness < 18
                ) {
                    continue;
                }


                red += r;

                green += g;

                blue += b;

                count++;
            }


            if (
                count === 0
            ) {

                setDefaultAmbient();

                return;
            }


            red =
                Math.round(
                    red / count
                );

            green =
                Math.round(
                    green / count
                );

            blue =
                Math.round(
                    blue / count
                );


            const hsl =
                rgbToHsl(
                    red,
                    green,
                    blue
                );


            const safeSaturation =
                Math.min(
                    Math.max(
                        hsl.s,
                        18
                    ),
                    38
                );


            const safeLightness =
                Math.min(
                    Math.max(
                        hsl.l,
                        22
                    ),
                    36
                );


            const safeColor =
                `hsl(${hsl.h} ${safeSaturation}% ${safeLightness}%)`;


            const softColor =
                `hsla(${hsl.h}, ${safeSaturation}%, ${safeLightness}%, .105)`;

            const faintColor =
                `hsla(${hsl.h}, ${safeSaturation}%, ${safeLightness}%, .055)`;

            const centerColor =
                `hsla(${hsl.h}, ${safeSaturation}%, ${safeLightness}%, .035)`;

            const glassColor =
                `hsla(${hsl.h}, ${safeSaturation}%, ${safeLightness}%, .065)`;

            const artColor =
                `hsla(${hsl.h}, ${safeSaturation}%, ${safeLightness + 3}%, .17)`;


            document.documentElement.style.setProperty(
                "--ambient-color-soft",
                softColor
            );

            document.documentElement.style.setProperty(
                "--ambient-color-faint",
                faintColor
            );

            document.documentElement.style.setProperty(
                "--ambient-color-center",
                centerColor
            );

            document.documentElement.style.setProperty(
                "--ambient-color-glass",
                glassColor
            );

            document.documentElement.style.setProperty(
                "--ambient-color-art",
                artColor
            );


            const glassPrimary =
                `hsla(${hsl.h}, ${safeSaturation}%, 9%, .72)`;

            const glassSecondary =
                `hsla(${hsl.h}, ${safeSaturation}%, 5%, .84)`;


            document.documentElement.style.setProperty(
                "--glass-color-primary",
                glassPrimary
            );

            document.documentElement.style.setProperty(
                "--glass-color-secondary",
                glassSecondary
            );


            const glassBorderColor =
                `hsla(${hsl.h}, ${safeSaturation}%, 62%, .16)`;


            document.documentElement.style.setProperty(
                "--glass-border-color",
                glassBorderColor
            );


            const traceSoft =
                `hsla(${hsl.h}, ${safeSaturation}%, 60%, .10)`;

            const traceMedium =
                `hsla(${hsl.h}, ${safeSaturation}%, 68%, .38)`;

            const traceBright =
                `hsla(${hsl.h}, ${safeSaturation}%, 78%, .82)`;

            const traceGlow =
                `hsla(${hsl.h}, ${safeSaturation}%, 65%, .42)`;


            document.documentElement.style.setProperty(
                "--glass-trace-soft",
                traceSoft
            );

            document.documentElement.style.setProperty(
                "--glass-trace-medium",
                traceMedium
            );

            document.documentElement.style.setProperty(
                "--glass-trace-bright",
                traceBright
            );

            document.documentElement.style.setProperty(
                "--glass-trace-glow",
                traceGlow
            );


            const outerGlow =
                `hsla(${hsl.h}, ${safeSaturation}%, 35%, .055)`;


            document.documentElement.style.setProperty(
                "--glass-outer-glow",
                outerGlow
            );


            console.log(
                "Album color:",
                safeColor
            );

        }
        catch (error) {

            console.warn(
                "Could not extract album color:",
                error.message
            );
        }
    }


    /* ==================================================
       RGB → HSL
    ================================================== */

    function rgbToHsl(r, g, b) {

        r /= 255;

        g /= 255;

        b /= 255;


        const max =
            Math.max(
                r,
                g,
                b
            );

        const min =
            Math.min(
                r,
                g,
                b
            );


        let h = 0;

        let s = 0;


        const l =
            (
                max +
                min
            ) / 2;


        if (
            max !== min
        ) {

            const d =
                max -
                min;


            s =
                l > .5
                    ? d /
                        (
                            2 -
                            max -
                            min
                        )
                    : d /
                        (
                            max +
                            min
                        );


            switch (max) {

                case r:

                    h =
                        (
                            g -
                            b
                        ) / d +
                        (
                            g < b
                                ? 6
                                : 0
                        );

                    break;


                case g:

                    h =
                        (
                            b -
                            r
                        ) / d +
                        2;

                    break;


                case b:

                    h =
                        (
                            r -
                            g
                        ) / d +
                        4;

                    break;
            }


            h /= 6;
        }


        return {

            h:
                Math.round(
                    h * 360
                ),

            s:
                Math.round(
                    s * 100
                ),

            l:
                Math.round(
                    l * 100
                )
        };
    }


    /* ==================================================
       LOAD ALBUM ART
    ================================================== */

    function loadAlbumArt(url) {

        if (!url) {

            albumArtElement.classList.remove(
                "loaded"
            );

            albumArtElement.removeAttribute(
                "src"
            );

            currentAlbumArt =
                null;

            setDefaultAmbient();

            return;
        }


        if (
            currentAlbumArt ===
            url
        ) {
            return;
        }


        currentAlbumArt =
            url;


        albumArtElement.classList.remove(
            "loaded"
        );


        albumArtElement.src =
            url;


        albumArtElement.onload =
            () => {

                albumArtElement.classList.add(
                    "loaded"
                );
            };


        albumArtElement.onerror =
            () => {

                console.warn(
                    "Album artwork could not be loaded:",
                    url
                );

                albumArtElement.classList.remove(
                    "loaded"
                );
            };


        const image =
            new Image();


        image.crossOrigin =
            "anonymous";


        image.onload =
            () => {

                updateAmbientFromImage(
                    image
                );
            };


        image.onerror =
            () => {

                console.warn(
                    "Could not load album image for color extraction."
                );
            };


        image.src =
            url;
    }

        if (!track) {

        }


        if (
            lyricsRequestTrack ===
            track.id
        ) {
            return;
        }


        lyricsRequestTrack =
            track.id;

            "";

        try {

            const params =
                new URLSearchParams({

                    id:
                        track.id,

                    title:
                        track.title,

                    artist:
                        track.artist,

                    album:

                    duration:

                });


            const response =
                await fetch(
                    "/api/lyrics?" +
                    params.toString(),
                    {
                        cache:
                            "no-store"
                    }
                );


            if (
                !response.ok
            ) {
                throw new Error(
                    "Lyrics request failed"
                );
            }


            const data =
                await response.json();


            if (
                requestVersion !==
                    lyricsRequestVersion ||

                currentTrackId !==
                    track.id
            ) {
                return;

            loadingElement.style.display =
                "none";


            if (
                data.syncedLyrics
            ) {

                currentLyrics =
                    parseSyncedLyrics(

                    );

            if (
                currentLyrics.length === 0 &&
                data.lyrics
            ) {

                    );

            noLyricsElement.style.display =
                "block";
        }

    /* ==================================================
       PARSE SYNCED LYRICS
    ================================================== */

    function parseSyncedLyrics(text) {

        const lines =
            text.split(
                /\r?\n/
            );


        const result =
            [];


        for (
            const line of lines
        ) {

            const match =
                line.match(
                    /^\[(\d+):(\d+(?:\.\d+)?)\]\s*(.*)$/
                );


            if (!match) {
                continue;
            }


            const minutes =
                Number(
                    match[1]
                );


            const seconds =
                Number(
                    match[2]
                );


            const timestamp =
                (
                    minutes * 60 +
                    seconds
                ) * 1000;


            const lyric =
                match[3].trim();


            if (!lyric) {
                continue;
            }


            result.push({

                time:
                    timestamp,

                text:
                    lyric
            });
        }


        return result.sort(
            (
                a,
                b
            ) =>
                a.time -
                b.time
        );
    }


    /* ==================================================
       PLAIN LYRICS
    ================================================== */

    function parsePlainLyrics(text) {

        const lines =
            text.split(
                /\r?\n/
            );


        return lines

            .map(
                (
                    line,
                    index
                ) => ({

                    time:
                        index * 4000,

                    text:
                        line.trim()
                })
            )

            .filter(
                line =>
                    line.text.length > 0
            );
    }


    /* ==================================================
       CURRENT LYRIC
    ================================================== */

    function getCurrentLyricIndex(position) {

        if (
            currentLyrics.length === 0
        ) {
            return -1;
        }


        let currentIndex =
            -1;


        for (
            let i = 0;
            i < currentLyrics.length;
            i++
        ) {

            if (
                position >=
                currentLyrics[i].time
            ) {

                currentIndex =
                    i;

            }
            else {
                break;
            }
        }


        return currentIndex;
    }


    /* ==================================================
       LINE CLASSIFICATION

       ONLY:

       current
       next-1
       next-2
       hidden

       There are NO previous lyric positions.
    ================================================== */

    function classifyLine(
        index,
        currentIndex
    ) {

        if (
            index ===
            currentIndex
        ) {
            return "current";
        }


        if (
            index ===
            currentIndex + 1
        ) {
            return "next-1";
        }


        if (
            index ===
            currentIndex + 2
        ) {
            return "next-2";
        }


        return "hidden";
    }


    /* ==================================================
       SPLIT LYRIC INTO SENTENCES
    ================================================== */

    function splitIntoSentences(text) {

        if (!text) {
            return [];
        }


        const matches =
            text.match(
                /[^.!?]+[.!?]+|[^.!?]+$/g
            );


        if (!matches) {
            return [
                text.trim()
            ];
        }


        return matches

            .map(
                sentence =>
                    sentence.trim()
            )

            .filter(Boolean);
    }


    /* ==================================================
       BUILD LYRIC ROWS
    ================================================== */

    function buildLyricRows() {

        lyricsElement.innerHTML =
            "";


        lineElements =
            currentLyrics.map(
                line => {

                    const element =
                        document.createElement(
                            "div"
                        );


                    element.className =
                        "lyric-line hidden";


                    const sentences =
                        splitIntoSentences(
                            line.text
                        );


                    sentences.forEach(
                        (
                            sentence,
                            sentenceIndex
                        ) => {

                            const sentenceElement =
                                document.createElement(
                                    "span"
                                );


                            sentenceElement.className =
                                "lyric-sentence";


                            const words =
                                sentence
                                    .trim()
                                    .split(/\s+/);


                            words.forEach(
                                (
                                    word,
                                    wordIndex
                                ) => {

                                    const span =
                                        document.createElement(
                                            "span"
                                        );


                                    span.className =
                                        "lyric-word";


                                    span.textContent =
                                        word;


                                    if (
                                        wordIndex <
                                        words.length - 1
                                    ) {

                                        span.textContent +=
                                            " ";
                                    }


                                    sentenceElement.appendChild(
                                        span
                                    );
                                }
                            );


                            element.appendChild(
                                sentenceElement
                            );


                            if (
                                sentenceIndex <
                                sentences.length - 1
                            ) {

                                element.appendChild(
                                    document.createTextNode(
                                        " "
                                    )
                                );
                            }
                        }
                    );


                    lyricsElement.appendChild(
                        element
                    );


                    return element;
                }
            );
    }


    /* ==================================================
       RESET WORD STATES
    ================================================== */

    function resetWordStates() {

        lineElements.forEach(
            element => {

                element
                    .querySelectorAll(
                        ".lyric-word"
                    )
                    .forEach(
                        word => {

                            word.classList.remove(
                                "active"
                            );
                        }
                    );
            }
        );
    }


    /* ==================================================
       REVEAL ONE SENTENCE
    ================================================== */

    function revealSentence(
        sentenceElement,
        progress
    ) {

        const words =
            sentenceElement.querySelectorAll(
                ".lyric-word"
            );


        if (
            words.length === 0
        ) {
            return;
        }


        const wordProgress =
            progress *
            words.length;


        words.forEach(
            (
                word,
                wordIndex
            ) => {

                const wordStart =
                    wordIndex;


                const wordAmount =
                    Math.min(
                        1,
                        Math.max(
                            0,
                            wordProgress -
                            wordStart
                        )
                    );


                if (
                    wordAmount >= 0.5
                ) {

                    word.classList.add(
                        "active"
                    );

                }
                else {

                    word.classList.remove(
                        "active"
                    );
                }
            }
        );
    }


    /* ==================================================
       SMOOTH KARAOKE REVEAL
    ================================================== */

    function updateWordReveal(
        element,
        position,
        index
    ) {

        if (
            !element ||
            !currentLyrics[index]
        ) {
            return;
        }


        const line =
            currentLyrics[index];


        const next =
            currentLyrics[index + 1];


        const start =
            Number(
                line.time
            ) || 0;


        const end =
            next &&
            Number.isFinite(
                Number(
                    next.time
                )
            ) &&
            Number(
                next.time
            ) > start

                ? Number(
                    next.time
                )

                : start + 3000;


        const duration =
            Math.max(
                700,
                end - start
            );


        const elapsed =
            Math.max(
                0,
                position -
                start +
                KARAOKE_LEAD
            );


        const progress =
            Math.min(
                1,
                elapsed /
                duration
            );


        const sentenceElements =
            element.querySelectorAll(
                ".lyric-sentence"
            );


        if (
            sentenceElements.length === 0
        ) {
            return;
        }


        /* ==================================================
           SINGLE SENTENCE
        ================================================== */

        if (
            sentenceElements.length === 1
        ) {

            revealSentence(
                sentenceElements[0],
                progress
            );

            return;
        }


        /* ==================================================
           MULTIPLE SENTENCES
        ================================================== */

        const sentenceCount =
            sentenceElements.length;


        const sentenceProgress =
            progress *
            sentenceCount;


        sentenceElements.forEach(
            (
                sentence,
                sentenceIndex
            ) => {

                const localProgress =
                    Math.min(
                        1,
                        Math.max(
                            0,
                            sentenceProgress -
                            sentenceIndex
                        )
                    );


                revealSentence(
                    sentence,
                    localProgress
                );
            }
        );
    }


    /* ==================================================
       POSITION VISIBLE LYRICS

       Instead of centering around a previous/current
       stack, the current lyric starts at the main
       visual position.

       Next 1 and next 2 remain below it.

       Previous lines are not part of the layout.
    ================================================== */

    function positionLyrics(
        currentIndex
    ) {

        if (
            currentIndex < 0 ||
            lineElements.length === 0
        ) {
            return;
        }


        const viewport =
            lyricsElement.parentElement;


        const viewportHeight =
            viewport.clientHeight;


        /*
           Put the CURRENT lyric around the upper-middle
           portion of the viewport.

           This leaves more room below it for:
             next-1
             next-2
        */

        const currentTop =
            Math.max(
                30,
                viewportHeight * 0.12
            );


        /*
           Since hidden previous lines use display:none,
           we cannot rely on currentIndex * rowHeight.

           Instead we calculate the height of the visible
           stack directly.
        */

        let visibleHeight =
            0;


        for (
            let i = currentIndex;
            i <= currentIndex + 2 &&
            i < lineElements.length;
            i++
        ) {

            const element =
                lineElements[i];


            visibleHeight +=
                element.offsetHeight;
        }


        /*
           Current element begins at currentTop.
        */

        const currentElement =
            lineElements[
                currentIndex
            ];


        if (
            currentElement
        ) {

            /*
               Offset the complete lyrics container
               so the current line begins at the
               desired visual position.
            */

            const trackOffset =
                currentTop -
                currentElement.offsetTop;


            lyricsElement.style.transform =
                "translate3d(0, " +
                trackOffset +
                "px, 0)";
        }
    }


    /* ==================================================
       RENDER LYRICS
    ================================================== */

    function renderLyrics(
        currentIndex
    ) {

        if (
            lineElements.length === 0
        ) {
            return;
        }


        /*
           Apply ONLY:

           current
           next-1
           next-2
           hidden
        */

        for (
            let i = 0;
            i < lineElements.length;
            i++
        ) {

            const element =
                lineElements[i];


            const tier =
                classifyLine(
                    i,
                    currentIndex
                );


            element.className =
                "lyric-line " +
                tier;
        }


        resetWordStates();


        if (
            currentIndex < 0
        ) {
            return;
        }


        /*
           Wait one frame so the browser has applied
           display:none/display:block before measuring
           the current lyric position.
        */

        requestAnimationFrame(
            () => {

                positionLyrics(
                    currentIndex
                );

            }
        );


        const currentElement =
            lineElements[
                currentIndex
            ];


        if (
            currentElement &&
            !harmonizing
        ) {

            updateWordReveal(
                currentElement,
                getPlaybackPosition(),
                currentIndex
            );
        }
    }


    /* ==================================================
       UPDATE LYRICS
    ================================================== */

    function updateLyrics(position) {

        if (
            currentLyrics.length === 0 ||
            harmonizing
        ) {
            return;
        }


        const currentIndex =
            getCurrentLyricIndex(
                position
            );


        /*
           Only rebuild the visual position
           when the lyric actually changes.
        */

        if (
            currentIndex !==
            lastLyricIndex
        ) {

            lastLyricIndex =
                currentIndex;


            renderLyrics(
                currentIndex
            );
        }


        /*
           Word highlighting continues smoothly
           between lyric changes.
        */

        const currentElement =
            lineElements[
                currentIndex
            ];


        if (
            currentElement &&
            currentIndex >= 0 &&
            !harmonizing
        ) {

            updateWordReveal(
                currentElement,
                position,
                currentIndex
            );
        }
    }


    /* ==================================================
       AUTHORITATIVE LOCAL PLAYBACK CLOCK
    ================================================== */

    function getPlaybackPosition() {

        if (
            !lastServerSyncTime
        ) {
            return lastServerPosition;
        }


        if (
            !isPlaybackActive
        ) {
            return lastServerPosition;
        }


        const elapsed =
            Math.max(
                0,
                performance.now() -
                lastServerSyncTime
            );


        return (
            lastServerPosition +
            elapsed
        );
    }


    function getEstimatedPosition() {

        return getPlaybackPosition();
    }


    /* ==================================================
       HARMONIZE
    ================================================== */

    async function harmonize(
        transition
    ) {

        harmonizing =
            true;


        overlay.classList.add(
            "harmonizing"
        );


        await sleep(
            HARMONIZE_HIDE_TIME
        );


        if (
            lastTransition ===
            transition
        ) {

            harmonizing =
                false;


            overlay.classList.remove(
                "harmonizing"
            );


            lastLyricIndex =
                undefined;


            updateLyrics(
                getEstimatedPosition()
            );
        }
    }


    /* ==================================================
       SLEEP
    ================================================== */

    function sleep(ms) {

        return new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    ms
                )
        );
    }


    /* ==================================================
       UPDATE SPOTIFY
    ================================================== */

    let spotifyUpdateRunning =
        false;


    async function updateSpotify() {

        if (
            spotifyUpdateRunning
        ) {
            return;
        }


        spotifyUpdateRunning =
            true;


        let track =
            null;


        try {

            track =
                await getSpotify();

        }
        finally {

            spotifyUpdateRunning =
                false;
        }


        if (!track) {
            return;
        }


        /* ==================================================
           AUTHORITATIVE SERVER SAMPLE
        ================================================== */

        const syncedPosition =
            Number(
                track.position
            ) || 0;


        const now =
            performance.now();


        if (
            Number.isFinite(
                Number(
                    track.syncedAt
                )
            )
        ) {

            const sampleAge =
                Math.max(
                    0,
                    Date.now() -
                    Number(
                        track.syncedAt
                    )
                );


            lastServerPosition =
                syncedPosition +
                (
                    track.playing
                        ? sampleAge
                        : 0
                );

        }
        else {

            lastServerPosition =
                syncedPosition;
        }


        lastServerSyncTime =
            now;


        isPlaybackActive =
            !!track.playing;


        /* ==================================================
           STOPPED
        ================================================== */

        if (
            !track.playing &&
            !track.id
        ) {

            isPlaybackActive =
                false;


            harmonizing =
                false;


            overlay.classList.remove(
                "visible"
            );

            overlay.classList.remove(
                "harmonizing"
            );


            setDefaultAmbient();


            titleElement.textContent =
                "Waiting for Spotify...";


            albumArtElement.classList.remove(
                "loaded"
            );


            albumArtElement.removeAttribute(
                "src"
            );


            currentAlbumArt =
                null;


            return;
        }


        /* ==================================================
           NEW TRACK
        ================================================== */

        if (
            currentTrackId !==
            track.id
        ) {

            console.log(
                "New Spotify track:",
                track.title,
                "-",
                track.artist
            );


            harmonizing =
                false;


            overlay.classList.remove(
                "harmonizing"
            );


            currentTrackId =
                track.id;


            lyricsRequestTrack =
                null;


            lyricsRequestVersion++;


            currentLyrics =
                [];


            lineElements =
                [];


            lastLyricIndex =
                undefined;


            lyricsElement.innerHTML =
                "";


            /* ==============================================
               TITLE
            ============================================== */

            titleElement.classList.remove(
                "song-change"
            );


            void titleElement.offsetWidth;


            titleElement.textContent =
                track.title;


            titleElement.classList.add(
                "song-change"
            );


            /* ==============================================
               ALBUM ART
            ============================================== */

            loadAlbumArt(
                track.albumArt
            );


            /* ==============================================
               LYRICS
            ============================================== */

            await getLyrics(
                track
            );
        }


        /* ==================================================
           TRANSITION
        ================================================== */

        const transition =
            track.transition;


        if (
            transition &&
            transition !==
            lastTransition
        ) {

            lastTransition =
                transition;


            /* ==============================================
               PAUSED
            ============================================== */

            if (
                transition ===
                "PAUSED"
            ) {

                isPlaybackActive =
                    false;


                harmonizing =
                    false;


                overlay.classList.remove(
                    "visible"
                );

                overlay.classList.remove(
                    "harmonizing"
                );


                return;
            }


            /* ==============================================
               RESUMED
            ============================================== */

            if (
                transition ===
                "RESUMED"
            ) {

                isPlaybackActive =
                    true;


                harmonizing =
                    false;


                overlay.classList.add(
                    "visible"
                );


                lastLyricIndex =
                    undefined;


                updateLyrics(
                    getEstimatedPosition()
                );


                return;
            }


            /* ==============================================
               FAST FORWARD
            ============================================== */

            if (
                transition ===
                "FAST_FORWARD"
            ) {

                await harmonize(
                    "FAST_FORWARD"
                );

                return;
            }


            /* ==============================================
               REWIND
            ============================================== */

            if (
                transition ===
                "REWIND"
            ) {

                await harmonize(
                    "REWIND"
                );

                return;
            }


            /* ==============================================
               TRACK CHANGED
            ============================================== */

            if (
                transition ===
                "TRACK_CHANGED"
            ) {

                isPlaybackActive =
                    !!track.playing;


                harmonizing =
                    false;


                overlay.classList.remove(
                    "harmonizing"
                );


                overlay.classList.add(
                    "visible"
                );


                lastLyricIndex =
                    undefined;


                updateLyrics(
                    getEstimatedPosition()
                );
            }
        }


        /* ==================================================
           NORMAL PLAYING
        ================================================== */

        if (
            track.playing
        ) {

            isPlaybackActive =
                true;


            harmonizing =
                false;


            overlay.classList.remove(
                "harmonizing"
            );


            overlay.classList.add(
                "visible"
            );


            updateLyrics(
                getEstimatedPosition()
            );


            return;
        }


        /* ==================================================
           PAUSED
        ================================================== */

        isPlaybackActive =
            false;


        harmonizing =
            false;


        overlay.classList.remove(
            "visible"
        );

        overlay.classList.remove(
            "harmonizing"
        );
    }


    /* ==================================================
       INITIAL LOAD
    ================================================== */

    updateSpotify();


    /* ==================================================
       SERVER SYNC

       Frontend synchronizes with backend every
       2 seconds.

       requestAnimationFrame handles interpolation.
    ================================================== */

    setInterval(
        updateSpotify,
        2000
    );


    /* ==================================================
       SMOOTH LYRIC CLOCK
    ================================================== */

    function smoothUpdate() {

        if (
            currentTrackId &&
            currentLyrics.length > 0 &&
            isPlaybackActive &&
            !harmonizing
        ) {

            updateLyrics(
                getEstimatedPosition()
            );
        }


        requestAnimationFrame(
            smoothUpdate
        );
    }


    requestAnimationFrame(
        smoothUpdate
    );

</script>

</body>

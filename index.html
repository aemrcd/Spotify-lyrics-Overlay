<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Spotify Lyrics Overlay</title>


<style>

/* ==================================================
   ROBOTO
================================================== */

@import url(
    "https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap"
);


/* ==================================================
   GLOBAL
================================================== */

* {
    box-sizing: border-box;
}


html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;

    font-family:
        "Roboto",
        Arial,
        Helvetica,
        sans-serif;

    color: white;

    -webkit-font-smoothing: antialiased;

    -moz-osx-font-smoothing: grayscale;

    text-rendering: optimizeLegibility;

    cursor: none;
}


#app {

    position: fixed;

    inset: 0;

    pointer-events: none;

    background: #000;
}


/* ==================================================
   TITLE
================================================== */

#titleWrap {

    position: fixed;

    left: 50%;

    bottom: 340px;

    transform:
        translateX(-50%);

    width:
        min(1000px, 90vw);

    text-align: center;

    opacity: 0;

    transition:
        opacity .7s ease;
}


#titleWrap.visible {

    opacity: 1;
}


/* ==================================================
   LYRICS
================================================== */

#overlay {

    position: fixed;

    left: 50%;

    bottom: 90px;

    transform:
        translateX(-50%);

    width:
        min(1000px, 90vw);

    text-align: center;

    opacity: 0;

    transition:
        opacity .5s ease;
}


#overlay.visible {

    opacity: 1;
}


/*
When harmonizing we intentionally hide
the lyrics until the new Spotify position
has been synchronized.
*/

#overlay.harmonizing {

    opacity: 0;
}


/* ==================================================
   NOW PLAYING
================================================== */

.song-info {

    margin-bottom: 28px;

    opacity: .9;
}


#title {

    margin: 0;

    font-size: 34px;

    line-height: 1.1;

    font-weight: 700;

    letter-spacing: -.5px;

    color: white;

    text-shadow:
        0 2px 6px
        rgba(0, 0, 0, .75);
}


#artist {

    margin-top: 8px;

    font-size: 17px;

    font-weight: 500;

    color:
        rgba(255, 255, 255, .75);

    text-shadow:
        0 2px 6px
        rgba(0, 0, 0, .65);
}


/* ==================================================
   PLAYBACK BADGE
================================================== */

.badge {

    display: inline-flex;

    align-items: center;

    gap: 9px;

    margin-bottom: 16px;

    padding:
        8px 15px;

    border-radius: 999px;

    background:
        rgba(0, 0, 0, .5);

    border:
        1px solid
        rgba(255, 255, 255, .12);

    backdrop-filter:
        blur(12px);

    font-size: 10px;

    font-weight: 700;

    letter-spacing: 2px;

    text-transform: uppercase;

    color:
        rgba(255, 255, 255, .8);

    transition:
        color .25s ease,
        border-color .25s ease,
        box-shadow .25s ease;
}


/* ==================================================
   STATUS COLORS
================================================== */

.badge.playing {

    color:
        #1ed760;

    border-color:
        rgba(30, 215, 96, .35);

    box-shadow:
        0 0 15px
        rgba(30, 215, 96, .15);
}


.badge.paused {

    color:
        #ffd60a;

    border-color:
        rgba(255, 214, 10, .35);

    box-shadow:
        0 0 15px
        rgba(255, 214, 10, .15);
}


.badge.resumed {

    color:
        #1ed760;

    border-color:
        rgba(30, 215, 96, .35);
}


.badge.harmonizing {

    color:
        #ff9500;

    border-color:
        rgba(255, 149, 0, .4);

    box-shadow:
        0 0 18px
        rgba(255, 149, 0, .2);
}


.badge.rewind {

    color:
        #4da6ff;

    border-color:
        rgba(77, 166, 255, .4);

    box-shadow:
        0 0 18px
        rgba(77, 166, 255, .2);
}


.badge.stopped {

    color:
        rgba(255, 255, 255, .45);
}


/* ==================================================
   STATUS DOT
================================================== */

.dot {

    width: 8px;

    height: 8px;

    flex-shrink: 0;

    border-radius: 50%;

    background:
        currentColor;

    box-shadow:
        0 0 8px
        currentColor;

    animation:
        statusPulse 1.2s ease-in-out infinite;
}


/* ==================================================
   STATUS FLICKER
================================================== */

.badge.flicker {

    animation:
        statusFlicker .65s ease-in-out;
}


@keyframes statusFlicker {

    0% {

        opacity: 1;

        filter:
            brightness(1);
    }

    20% {

        opacity: .45;

        filter:
            brightness(1.8);
    }

    40% {

        opacity: 1;

        filter:
            brightness(1);
    }

    60% {

        opacity: .55;

        filter:
            brightness(1.6);
    }

    100% {

        opacity: 1;

        filter:
            brightness(1);
    }
}


@keyframes statusPulse {

    0% {

        transform:
            scale(1);

        opacity: .65;
    }

    50% {

        transform:
            scale(1.35);

        opacity: 1;
    }

    100% {

        transform:
            scale(1);

        opacity: .65;
    }
}


/* ==================================================
   LYRICS VIEWPORT
================================================== */

.roller-viewport {

    position: relative;

    width: 100%;

    height: 320px;

    overflow: hidden;

    -webkit-mask-image:
        linear-gradient(
            to bottom,
            transparent 0%,
            black 20%,
            black 80%,
            transparent 100%
        );

    mask-image:
        linear-gradient(
            to bottom,
            transparent 0%,
            black 20%,
            black 80%,
            transparent 100%
        );
}


#lyrics {

    position: absolute;

    left: 0;

    right: 0;

    top: 0;

    transition:
        transform .65s
        cubic-bezier(
            .22,
            1,
            .36,
            1
        );
}


/* ==================================================
   LYRIC LINE
================================================== */

.lyric-line {

    height: 64px;

    display: flex;

    align-items: center;

    justify-content: center;

    padding:
        0 20px;

    font-size: 29px;

    line-height: 1.25;

    font-weight: 500;

    color:
        rgba(255, 255, 255, .35);

    text-shadow:
        0 2px 6px
        rgba(0, 0, 0, .65);

    transform: none;
}


.lyric-line .wave-char {

    display: inline-block;

    position: relative;

    transform-origin:
        center center;

    will-change:
        transform;

    backface-visibility: hidden;

    -webkit-font-smoothing: antialiased;
}


/* ==================================================
   CURRENT LINE
================================================== */

.lyric-line.current {

    opacity: 1;

    transform: none;

    font-size: 30px;

    font-weight: 700;

    color: white;

    text-shadow:
        0 2px 8px
        rgba(0, 0, 0, .75);
}


.lyric-line.current .wave-char {

    color: white;

    -webkit-text-fill-color: white;
}


/* ==================================================
   CHARACTER WAVE
================================================== */

.lyric-line.current
.wave-char.wave-active {

    animation:
        smoothLetterWave
        .42s
        cubic-bezier(
            .25,
            .8,
            .25,
            1
        );
}


@keyframes smoothLetterWave {

    0% {

        transform:
            scale(1);
    }

    35% {

        transform:
            scale(1.35);
    }

    50% {

        transform:
            scale(1.42);
    }

    100% {

        transform:
            scale(1);
    }
}


/* ==================================================
   OTHER LINES
================================================== */

.lyric-line.prev-2 {

    opacity: .12;

    transform: none;
}


.lyric-line.prev-1 {

    opacity: .35;

    transform: none;
}


.lyric-line.next-1 {

    opacity: .40;

    transform: none;
}


.lyric-line.next-2 {

    opacity: .16;

    transform: none;
}


/* ==================================================
   LOADING
================================================== */

#loading {

    display: none;

    font-size: 16px;

    color:
        rgba(255, 255, 255, .55);
}


/* ==================================================
   NO LYRICS
================================================== */

#noLyrics {

    display: none;

    font-size: 22px;

    color:
        rgba(255, 255, 255, .5);
}


/* ==================================================
   SONG CHANGE
================================================== */

@keyframes songChange {

    0% {

        opacity: 0;

        transform:
            translateY(15px);
    }

    100% {

        opacity: 1;

        transform:
            translateY(0);
    }
}


.song-change {

    animation:
        songChange .7s
        cubic-bezier(
            .22,
            1,
            .36,
            1
        );
}


/* ==================================================
   MOBILE
================================================== */

@media (max-width: 700px) {

    #title {

        font-size: 26px;
    }


    #artist {

        font-size: 15px;
    }


    .lyric-line {

        font-size: 22px;
    }


    .lyric-line.current {

        font-size: 23px;
    }

}

</style>

</head>


<body>


<div id="app">


    <!-- ==================================================
         NOW PLAYING
    ================================================== -->

    <div id="titleWrap">

        <div
            id="playbackBadge"
            class="badge stopped"
        >

            <span class="dot"></span>

            <span id="playbackText">
                ■ STOPPED
            </span>

        </div>


        <div class="song-info">

            <h1 id="title">
                Waiting for Spotify...
            </h1>


            <div id="artist">
                Connect Spotify
            </div>

        </div>

    </div>


    <!-- ==================================================
         LYRICS
    ================================================== -->

    <div id="overlay">

        <div class="roller-viewport">

            <div id="lyrics"></div>

        </div>


        <div id="loading">
            Loading lyrics...
        </div>


        <div id="noLyrics">
            Lyrics unavailable
        </div>

    </div>

</div>


<script>

/* ==================================================
   STATE
================================================== */

let currentTrackId =
    null;


let currentLyrics =
    [];


let lineElements =
    [];


let lastServerPosition =
    0;


let lastServerSyncTime =
    0;


let lastLyricIndex =
    undefined;


let lyricsRequestTrack =
    null;


/*
Tracks whether the frontend is
currently harmonizing.
*/

let harmonizing =
    false;


/*
Used to prevent stale transitions
from hiding the lyrics forever.
*/

let lastTransition =
    null;


/* ==================================================
   SETTINGS
================================================== */

const ROW_HEIGHT =
    64;


const WAVE_DURATION =
    420;


const WAVE_DELAY =
    70;


const WAVE_PAUSE =
    500;


const WAVE_DELAY_MIN =
    25;


const WAVE_DELAY_MAX =
    100;


/*
How long we locally hide the lyrics
after a seek transition.

The server synchronization still
determines the actual lyric position.
*/

const HARMONIZE_HIDE_TIME =
    900;


/* ==================================================
   ELEMENTS
================================================== */

const overlay =
    document.getElementById(
        "overlay"
    );


const titleWrap =
    document.getElementById(
        "titleWrap"
    );


const titleElement =
    document.getElementById(
        "title"
    );


const artistElement =
    document.getElementById(
        "artist"
    );


const lyricsElement =
    document.getElementById(
        "lyrics"
    );


const loadingElement =
    document.getElementById(
        "loading"
    );


const noLyricsElement =
    document.getElementById(
        "noLyrics"
    );


const playbackBadge =
    document.getElementById(
        "playbackBadge"
    );


const playbackText =
    document.getElementById(
        "playbackText"
    );


/* ==================================================
   GET SERVER PLAYBACK
================================================== */

async function getSpotify() {

    try {

        const response =
            await fetch(

                "/api/current?ts=" +
                Date.now(),

                {
                    cache:
                        "no-store"
                }

            );


        if (!response.ok) {

            return null;
        }


        return await response.json();

    }

    catch (error) {

        console.error(
            "Server playback request failed:",
            error
        );


        return null;
    }
}


/* ==================================================
   PLAYBACK STATUS UI
================================================== */

function setPlaybackStatus(
    status,
    flicker = false
) {

    playbackBadge.className =
        "badge";


    let text =
        "■ STOPPED";


    switch (
        status
    ) {

        case "PLAYING":

            playbackBadge.classList.add(
                "playing"
            );

            text =
                "▶ PLAYING";

            break;


        case "RESUMED":

            playbackBadge.classList.add(
                "resumed"
            );

            text =
                "▶ RESUMED";

            break;


        case "PAUSED":

            playbackBadge.classList.add(
                "paused"
            );

            text =
                "⏸ PAUSED";

            break;


        case "FAST_FORWARD":

            playbackBadge.classList.add(
                "harmonizing"
            );

            text =
                "⏩ HARMONIZING";

            break;


        case "REWIND":

            playbackBadge.classList.add(
                "rewind"
            );

            text =
                "⏪ HARMONIZING";

            break;


        case "TRACK_CHANGED":

            playbackBadge.classList.add(
                "playing"
            );

            text =
                "▶ PLAYING";

            break;


        default:

            playbackBadge.classList.add(
                "stopped"
            );

            text =
                "■ STOPPED";
    }


    playbackText.textContent =
        text;


    if (flicker) {

        playbackBadge.classList.remove(
            "flicker"
        );


        void playbackBadge.offsetWidth;


        playbackBadge.classList.add(
            "flicker"
        );
    }
}


/* ==================================================
   GET LYRICS
================================================== */

async function getLyrics(
    track
) {

    if (!track) {

        return;
    }


    if (
        lyricsRequestTrack ===
        track.id
    ) {

        return;
    }


    lyricsRequestTrack =
        track.id;


    loadingElement.style.display =
        "block";


    noLyricsElement.style.display =
        "none";


    lyricsElement.innerHTML =
        "";


    lineElements =
        [];


    currentLyrics =
        [];


    try {

        const params =
            new URLSearchParams({

                id:
                    track.id,

                title:
                    track.title,

                artist:
                    track.artist,

                album:
                    track.album || "",

                duration:
                    track.duration

            });


        const response =
            await fetch(

                "/api/lyrics?" +
                params.toString(),

                {
                    cache:
                        "no-store"
                }

            );


        if (!response.ok) {

            throw new Error(
                "Lyrics request failed"
            );
        }


        const data =
            await response.json();


        loadingElement.style.display =
            "none";


        /*
        Prefer synchronized lyrics.
        */

        if (
            data.syncedLyrics
        ) {

            currentLyrics =
                parseSyncedLyrics(
                    data.syncedLyrics
                );
        }


        /*
        Plain lyric fallback.
        */

        if (
            currentLyrics.length === 0 &&
            data.lyrics
        ) {

            currentLyrics =
                parsePlainLyrics(
                    data.lyrics
                );
        }


        if (
            currentLyrics.length === 0
        ) {

            noLyricsElement.style.display =
                "block";

            return;
        }


        buildLyricRows();


        lastLyricIndex =
            undefined;


        updateLyrics(
            getEstimatedPosition()
        );

    }

    catch (error) {

        console.error(
            "Lyrics error:",
            error
        );


        loadingElement.style.display =
            "none";


        noLyricsElement.style.display =
            "block";
    }
}


/* ==================================================
   PARSE SYNCED LYRICS
================================================== */

function parseSyncedLyrics(
    text
) {

    const lines =
        text.split(
            /\r?\n/
        );


    const result =
        [];


    for (
        const line of lines
    ) {

        const match =
            line.match(
                /^\[(\d+):(\d+(?:\.\d+)?)\]\s*(.*)$/
            );


        if (!match) {

            continue;
        }


        const minutes =
            Number(
                match[1]
            );


        const seconds =
            Number(
                match[2]
            );


        const timestamp =
            (
                minutes * 60 +
                seconds
            ) * 1000;


        const lyric =
            match[3].trim();


        if (!lyric) {

            continue;
        }


        result.push({

            time:
                timestamp,

            text:
                lyric

        });
    }


    return result.sort(
        (
            a,
            b
        ) =>
            a.time -
            b.time
    );
}


/* ==================================================
   PLAIN LYRICS
================================================== */

function parsePlainLyrics(
    text
) {

    const lines =
        text.split(
            /\r?\n/
        );


    return lines

        .map(
            (
                line,
                index
            ) => ({

                time:
                    index * 4000,

                text:
                    line.trim()

            })
        )

        .filter(
            line =>
                line.text.length > 0
        );
}


/* ==================================================
   CURRENT LYRIC
================================================== */

function getCurrentLyricIndex(
    position
) {

    if (
        currentLyrics.length === 0
    ) {

        return -1;
    }


    let currentIndex =
        -1;


    for (
        let i = 0;
        i < currentLyrics.length;
        i++
    ) {

        if (
            position >=
            currentLyrics[i].time
        ) {

            currentIndex =
                i;

        } else {

            break;
        }
    }


    return currentIndex;
}


/* ==================================================
   LINE CLASSIFICATION
================================================== */

function classifyLine(
    index,
    currentIndex
) {

    const diff =
        index -
        currentIndex;


    if (
        diff === 0
    ) {

        return "current";
    }


    if (
        diff === -1
    ) {

        return "prev-1";
    }


    if (
        diff <= -2
    ) {

        return "prev-2";
    }


    if (
        diff === 1
    ) {

        return "next-1";
    }


    return "next-2";
}


/* ==================================================
   BUILD LYRIC ROWS
================================================== */

function buildLyricRows() {

    lyricsElement.innerHTML =
        "";


    lineElements =
        currentLyrics.map(
            line => {

                const element =
                    document.createElement(
                        "div"
                    );


                element.className =
                    "lyric-line";


                [
                    ...line.text
                ].forEach(
                    char => {

                        const span =
                            document.createElement(
                                "span"
                            );


                        span.className =
                            "wave-char";


                        span.textContent =
                            char === " "
                                ? "\u00A0"
                                : char;


                        element.appendChild(
                            span
                        );
                    }
                );


                lyricsElement.appendChild(
                    element
                );


                return element;
            }
        );
}


/* ==================================================
   WAVE
================================================== */

let waveToken =
    0;


function sleep(
    milliseconds
) {

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                milliseconds
            )
    );
}


/* ==================================================
   CHARACTER WAVE
================================================== */

async function runCharacterWave(
    lyricElement,
    letterDelay,
    token
) {

    if (
        !letterDelay
    ) {

        letterDelay =
            WAVE_DELAY;
    }


    if (!lyricElement) {

        return;
    }


    if (
        token !==
        waveToken
    ) {

        return;
    }


    const characters =
        lyricElement.querySelectorAll(
            ".wave-char"
        );


    characters.forEach(
        character => {

            character.classList.remove(
                "wave-active"
            );
        }
    );


    await sleep(50);


    if (
        token !==
        waveToken
    ) {

        return;
    }


    for (
        let i = 0;
        i < characters.length;
        i++
    ) {

        if (
            token !==
            waveToken
        ) {

            return;
        }


        /*
        Do not animate while paused
        or harmonizing.
        */

        if (
            harmonizing
        ) {

            return;
        }


        const character =
            characters[i];


        character.classList.remove(
            "wave-active"
        );


        void character.offsetWidth;


        character.classList.add(
            "wave-active"
        );


        await sleep(
            letterDelay
        );
    }


    await sleep(
        WAVE_DURATION
    );


    if (
        token !==
        waveToken
    ) {

        return;
    }


    await sleep(
        WAVE_PAUSE
    );


    if (
        token !==
        waveToken
    ) {

        return;
    }


    runCharacterWave(
        lyricElement,
        letterDelay,
        token
    );
}


/* ==================================================
   LINE DURATION
================================================== */

function getLineDuration(
    index
) {

    const line =
        currentLyrics[index];


    const next =
        currentLyrics[index + 1];


    if (
        !line ||
        !next
    ) {

        return 3000;
    }


    const diff =
        next.time -
        line.time;


    if (
        diff <= 0
    ) {

        return 3000;
    }


    return Math.min(
        Math.max(
            diff,
            800
        ),
        8000
    );
}


/* ==================================================
   WAVE DELAY
================================================== */

function getWaveDelayForLine(
    text,
    duration
) {

    const charCount =
        [...text].length ||
        1;


    const available =
        Math.max(
            duration -
            WAVE_DURATION -
            200,

            400
        );


    const delay =
        available /
        charCount;


    return Math.min(
        Math.max(
            delay,
            WAVE_DELAY_MIN
        ),
        WAVE_DELAY_MAX
    );
}


/* ==================================================
   RENDER LYRICS
================================================== */

function renderLyrics(
    currentIndex
) {

    if (
        lineElements.length === 0
    ) {

        return;
    }


    for (
        let i = 0;
        i < lineElements.length;
        i++
    ) {

        const element =
            lineElements[i];


        const tier =
            classifyLine(
                i,
                currentIndex
            );


        element.className =
            "lyric-line " +
            tier;
    }


    if (
        currentIndex < 0
    ) {

        return;
    }


    const viewport =
        lyricsElement.parentElement;


    const viewportHeight =
        viewport.clientHeight;


    const centerOffset =
        (
            viewportHeight / 2
        ) -
        (
            ROW_HEIGHT / 2
        );


    const trackOffset =
        centerOffset -
        (
            currentIndex *
            ROW_HEIGHT
        );


    lyricsElement.style.transform =
        "translate3d(0, " +
        trackOffset +
        "px, 0)";


    const currentElement =
        lineElements[
            currentIndex
        ];


    if (
        currentElement &&
        !harmonizing
    ) {

        const duration =
            getLineDuration(
                currentIndex
            );


        const letterDelay =
            getWaveDelayForLine(
                currentLyrics[
                    currentIndex
                ].text,
                duration
            );


        waveToken++;


        runCharacterWave(
            currentElement,
            letterDelay,
            waveToken
        );
    }
}


/* ==================================================
   UPDATE LYRICS
================================================== */

function updateLyrics(
    position
) {

    if (
        currentLyrics.length === 0 ||
        harmonizing
    ) {

        return;
    }


    const currentIndex =
        getCurrentLyricIndex(
            position
        );


    /*
    Only restart the wave when
    the lyric actually changes.
    */

    if (
        currentIndex !==
        lastLyricIndex
    ) {

        lastLyricIndex =
            currentIndex;


        renderLyrics(
            currentIndex
        );
    }
}


/* ==================================================
   ESTIMATED POSITION
================================================== */

function getEstimatedPosition() {

    if (
        !lastServerSyncTime
    ) {

        return lastServerPosition;
    }


    const elapsed =
        performance.now() -
        lastServerSyncTime;


    return (
        lastServerPosition +
        elapsed
    );
}


/* ==================================================
   HARMONIZE
================================================== */

async function harmonize(
    transition
) {

    harmonizing =
        true;


    /*
    Stop current wave immediately.
    */

    waveToken++;


    /*
    Hide lyrics.
    */

    overlay.classList.add(
        "harmonizing"
    );


    /*
    Display harmonizing state.
    */

    setPlaybackStatus(
        transition,
        true
    );


    /*
    Give the server a moment to
    establish the new position.
    */

    await sleep(
        HARMONIZE_HIDE_TIME
    );


    /*
    If another transition happened
    during this time, don't blindly
    reveal the lyrics.
    */

    if (
        lastTransition ===
        transition
    ) {

        harmonizing =
            false;


        overlay.classList.remove(
            "harmonizing"
        );


        lastLyricIndex =
            undefined;


        updateLyrics(
            getEstimatedPosition()
        );
    }
}


/* ==================================================
   UPDATE SPOTIFY
================================================== */

async function updateSpotify() {

    const track =
        await getSpotify();


    if (!track) {

        return;
    }


    /*
    Synchronize local clock.
    */

    lastServerPosition =
        Number(
            track.position
        ) || 0;


    lastServerSyncTime =
        performance.now();


    /*
    ==========================================
    STOPPED
    ==========================================
    */

    if (
        !track.playing &&
        !track.id
    ) {

        harmonizing =
            false;


        overlay.classList.remove(
            "visible"
        );


        overlay.classList.remove(
            "harmonizing"
        );


        titleWrap.classList.remove(
            "visible"
        );


        setPlaybackStatus(
            "STOPPED"
        );


        return;
    }


    /*
    ==========================================
    NEW TRACK
    ==========================================
    */

    if (
        currentTrackId !==
        track.id
    ) {

        console.log(
            "New Spotify track:",
            track.title,
            "-",
            track.artist
        );


        /*
        Stop previous animation.
        */

        waveToken++;


        harmonizing =
            false;


        overlay.classList.remove(
            "harmonizing"
        );


        currentTrackId =
            track.id;


        lyricsRequestTrack =
            null;


        currentLyrics =
            [];


        lineElements =
            [];


        lastLyricIndex =
            undefined;


        lyricsElement.innerHTML =
            "";


        /*
        Update title.
        */

        titleElement.classList.remove(
            "song-change"
        );


        void titleElement.offsetWidth;


        titleElement.textContent =
            track.title;


        titleElement.classList.add(
            "song-change"
        );


        artistElement.textContent =
            track.artist;


        /*
        New track while playing.
        */

        if (
            track.playing
        ) {

            setPlaybackStatus(
                "PLAYING",
                true
            );

        } else {

            setPlaybackStatus(
                "PAUSED",
                true
            );
        }


        /*
        Load lyrics once.

        The server cache prevents repeated
        LRCLIB requests.
        */

        await getLyrics(
            track
        );
    }


    /*
    ==========================================
    TRANSITION HANDLING
    ==========================================
    */

    const transition =
        track.transition;


    if (
        transition &&
        transition !==
        lastTransition
    ) {

        lastTransition =
            transition;


        /*
        PAUSE
        */

        if (
            transition ===
            "PAUSED"
        ) {

            harmonizing =
                false;


            waveToken++;


            overlay.classList.remove(
                "visible"
            );


            overlay.classList.remove(
                "harmonizing"
            );


            setPlaybackStatus(
                "PAUSED",
                true
            );


            return;
        }


        /*
        RESUME
        */

        if (
            transition ===
            "RESUMED"
        ) {

            harmonizing =
                false;


            overlay.classList.add(
                "visible"
            );


            setPlaybackStatus(
                "RESUMED",
                true
            );


            lastLyricIndex =
                undefined;


            updateLyrics(
                getEstimatedPosition()
            );


            return;
        }


        /*
        FAST FORWARD
        */

        if (
            transition ===
            "FAST_FORWARD"
        ) {

            await harmonize(
                "FAST_FORWARD"
            );


            return;
        }


        /*
        REWIND
        */

        if (
            transition ===
            "REWIND"
        ) {

            await harmonize(
                "REWIND"
            );


            return;
        }


        /*
        TRACK CHANGED
        */

        if (
            transition ===
            "TRACK_CHANGED"
        ) {

            harmonizing =
                false;


            overlay.classList.remove(
                "harmonizing"
            );


            overlay.classList.add(
                "visible"
            );


            setPlaybackStatus(
                "PLAYING",
                true
            );


            lastLyricIndex =
                undefined;


            updateLyrics(
                getEstimatedPosition()
            );
        }
    }


    /*
    ==========================================
    NORMAL PLAYING
    ==========================================
    */

    if (
        track.playing
    ) {

        harmonizing =
            false;


        overlay.classList.remove(
            "harmonizing"
        );


        overlay.classList.add(
            "visible"
        );


        titleWrap.classList.add(
            "visible"
        );


        /*
        Don't overwrite RESUMED/
        transition messages immediately.
        */

        if (
            transition !==
            "RESUMED" &&
            transition !==
            "TRACK_CHANGED"
        ) {

            setPlaybackStatus(
                "PLAYING"
            );
        }


        updateLyrics(
            getEstimatedPosition()
        );


        return;
    }


    /*
    ==========================================
    PAUSED
    ==========================================
    */

    harmonizing =
        false;


    waveToken++;


    overlay.classList.remove(
        "visible"
    );


    overlay.classList.remove(
        "harmonizing"
    );


    setPlaybackStatus(
        "PAUSED"
    );
}


/* ==================================================
   INITIAL LOAD
================================================== */

updateSpotify();


/* ==================================================
   SERVER SYNC
==================================================

IMPORTANT:

This only requests OUR server.

It does NOT request Spotify.

==================================================
*/

setInterval(
    updateSpotify,
    2000
);


/* ==================================================
   SMOOTH LYRIC CLOCK
==================================================

This runs locally in the browser.

It does NOT contact Spotify.

==================================================
*/

function smoothUpdate() {

    if (
        currentTrackId &&
        currentLyrics.length > 0 &&
        !harmonizing
    ) {

        updateLyrics(
            getEstimatedPosition()
        );
    }


    requestAnimationFrame(
        smoothUpdate
    );
}


requestAnimationFrame(
    smoothUpdate
);

</script>

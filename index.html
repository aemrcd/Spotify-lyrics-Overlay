<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Spotify Lyrics Overlay</title>

<style>

/* ==================================================
   FONTS
================================================== */

@import url('https://fonts.googleapis.com/css2?family=Sora:wght@700&family=Spline+Sans:wght@700&display=swap');


/* ==================================================
   GLOBAL
================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    background:
        #07080b;

    font-family:
        "Spline Sans",
        Arial,
        Helvetica,
        sans-serif;

    color: white;

    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;

    text-rendering: optimizeLegibility;

    cursor: none;
}

body {
    transition:
        background-color 1.2s ease;
}

#app {
    position: fixed;
    inset: 0;
    overflow: hidden;

    background:
        #07080b;

    transition:
        background 1.2s ease;
}


/* ==================================================
   AMBIENT BACKGROUND
================================================== */

.ambient {
    position: fixed;
    inset: -25%;

    pointer-events: none;
    z-index: 0;

    background:
        radial-gradient(
            circle at 25% 50%,
            var(--ambient-color-soft),
            transparent 35%
        ),
        radial-gradient(
            circle at 75% 50%,
            var(--ambient-color-faint),
            transparent 40%
        );

    filter:
        blur(70px);

    opacity: .75;

    transition:
        background 1.4s ease,
        opacity 1.2s ease;
}

.ambient::after {
    content: "";

    position: absolute;
    inset: 20%;

    border-radius: 50%;

    background:
        var(--ambient-color-center);

    filter:
        blur(90px);

    opacity: .5;
}


/* ==================================================
   MAIN SCENE
================================================== */

.scene {
    position: relative;
    z-index: 1;

    width: 100%;
    height: 100%;

    display: grid;
    place-items: center;

    padding: 30px;
}


/* ==================================================
   GLASS CONTAINER
================================================== */

.glass {
    position: relative;

    width:
        min(1180px, 94vw);

    min-height:
        560px;

    padding:
        55px 70px;

    border-radius:
        42px;

    /*
     * The glass uses a very dark version
     * of the album color.
     */
    background:
        linear-gradient(
            135deg,
            var(--glass-color-primary),
            var(--glass-color-secondary)
        );

    /*
     * Base border receives a subtle album tint.
     */
    border:
        1px solid
        var(--glass-border-color);

    backdrop-filter:
        blur(18px);

    -webkit-backdrop-filter:
        blur(18px);

    box-shadow:
        inset
        0 1px
        rgba(255, 255, 255, .055),

        0 35px 100px
        rgba(0, 0, 0, .45),

        /*
         * Very subtle album-colored outer glow.
         */
        0 0 45px
        var(--glass-outer-glow);

    overflow:
        hidden;

    transition:
        background 1.4s ease,
        border-color 1.4s ease,
        box-shadow 1.4s ease;
}


/* ==================================================
   GLASS AMBIENT COLOR
================================================== */

.glass::before {
    content: "";

    position: absolute;

    width:
        520px;

    height:
        520px;

    left:
        24%;

    top:
        50%;

    transform:
        translate(
            -50%,
            -50%
        );

    border-radius:
        50%;

    background:
        var(--ambient-color-glass);

    filter:
        blur(90px);

    opacity:
        .28;

    pointer-events:
        none;
}


/* ==================================================
   GLASS BORDER TRACE
================================================== */

.glass::after {
    content: "";

    position: absolute;

    inset: 0;

    z-index: 1;

    border-radius:
        inherit;

    padding:
        1px;

    /*
     * The trace uses the album color.
     *
     * Most of the border remains invisible.
     * A small colored section travels around
     * the entire glass.
     *
     * The white portion creates a clean
     * highlight at the leading edge.
     */
    background:
        conic-gradient(
            from var(--trace-angle),

            transparent 0deg 315deg,

            var(--glass-trace-soft) 330deg,

            var(--glass-trace-medium) 342deg,

            var(--glass-trace-bright) 350deg,

            rgba(255, 255, 255, .95) 356deg,

            transparent 360deg
        );

    /*
     * Keep only the border visible.
     */
    -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);

    -webkit-mask-composite:
        xor;

    mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);

    mask-composite:
        exclude;

    /*
     * Colored glow + small white highlight.
     */
    filter:
        drop-shadow(
            0 0 4px
            var(--glass-trace-glow)
        )
        drop-shadow(
            0 0 10px
            var(--glass-trace-glow)
        );

    pointer-events:
        none;

    animation:
        traceBorder
        8s
        linear
        infinite;
}


/* ==================================================
   TRACE ANGLE
================================================== */

@property --trace-angle {
    syntax: "<angle>";
    inherits: false;
    initial-value: 0deg;
}

@keyframes traceBorder {

    to {
        --trace-angle:
            360deg;
    }

}


/* ==================================================
   GLASS TOP HIGHLIGHT
================================================== */

.highlight {
    position: absolute;

    top: 0;
    left: 12%;

    width: 76%;
    height: 1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.12),
            transparent
        );
}


/* ==================================================
   CONTENT
================================================== */

.content {
    position: relative;
    z-index: 2;

    width: 100%;

    min-height:
        450px;

    display: grid;

    grid-template-columns:
        310px
        minmax(0, 1fr);

    align-items: center;

    column-gap:
        55px;
}


/* ==================================================
   VINYL SIDE
================================================== */

.vinyl-area {
    
    display: flex;

    flex-direction:
        column;

    align-items:
        center;

    justify-content:
        center;
    margin-left:
        0;

    perspective:
        850px;

    animation:
        vinylFloat 6s ease-in-out infinite;
}


@keyframes vinylFloat {

    0%,
    100% {

        transform:
            translateY(0);
    }

    50% {

        transform:
            translateY(-8px);
    }

}


/* ==================================================
   VINYL
================================================== */

.record {
    position: relative;

    width:
        clamp(
            210px,
        34vw,
            480px
        );
    margin-left:
        35%;

    transform-style:
        preserve-3d;

    transform:
        rotateX(18deg)
        rotateY(-20deg)
        rotateZ(-8deg);

    aspect-ratio: 1;

    flex:
        0 0 auto;

    border-radius:
        50%;

    background:
        radial-gradient(
            circle at 29% 22%,
            rgba(255,255,255,.22),
            transparent 16%
        ),

        radial-gradient(
            circle at 70% 76%,
            transparent 0 46%,
            rgba(0,0,0,.72) 78%,
            rgba(255,255,255,.10) 96%,
            #08090b 100%
        ),

        repeating-radial-gradient(
            circle,
            #090a0c 0 1px,
            #30343a 1.3px 1.8px,
            #111317 2.2px 3.8px
        ),

        #171a1e;

    animation:
        spin
        28s
        linear
        infinite;
}


.record::before {

    content: "";

    position: absolute;

    inset:
        -3%;

    z-index: -1;

    border-radius:
        50%;

    border:
        2px solid
        var(--ambient-color-art);

    box-shadow:
        0 0 12px
        var(--ambient-color-art),

        inset 0 0 8px
        rgba(255,255,255,.12);

    opacity:
        .72;

    pointer-events:
        none;
}


/* ==================================================
   VINYL EDGE
================================================== */

.record::after {
    content: "";

    position: absolute;

    inset: 2.5%;

    border-radius:
        50%;

    border:
        1px solid
        rgba(220,225,230,.32);

    box-shadow:
        inset 0 0 10px
        rgba(255,255,255,.13),

        0 0 8px
        rgba(255,255,255,.10);

    pointer-events:
        none;
}


/* ==================================================
   ALBUM ART
================================================== */

.album {
    position: absolute;

    inset:
       13%;

    border-radius:
        50%;

    overflow:
        hidden;

    background:
        linear-gradient(
            135deg,
            #25262a,
            #111216
        );

    box-shadow:

        0 0 0 1px
        rgba(255,255,255,.16),

        0 0 25px
        var(--ambient-color-art),

        inset
        0 0 20px
        rgba(0,0,0,.35);

    transform:
        translateZ(5px);

    transition:
        box-shadow 1.2s ease;
}


/* ==================================================
   ALBUM ART IMAGE
================================================== */

#albumArt {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;

    border-radius:
        50%;

    opacity: 0;

    transform:
        scale(1.01);

    transition:
        opacity .8s ease,
        transform .8s ease;
}

#albumArt.loaded {
    opacity: 1;

    transform:
        scale(1);
}


/* ==================================================
   ALBUM ART GLASS HIGHLIGHT
================================================== */

.album::after {
    content: "";

    position: absolute;

    inset: 0;

    border-radius:
        50%;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.24),
            transparent 32%,
            transparent 68%,
            rgba(0,0,0,.18)
        );

    mix-blend-mode:
        screen;

    pointer-events:
        none;
}


/* ==================================================
   VINYL CENTER HOLE
================================================== */

.hole {
    position: absolute;

    z-index: 5;

    width:
    30px;

    height:
        30px;

    border-radius:
        50%;

    left:
        50%;

    top:
        50%;

    transform:
        translate(
            -50%,
            -50%
        );

background:
    radial-gradient(
        circle at center,
        #bfc2c6 0 30%,
        #5f6368 32% 100%
    );

    box-shadow:

        0 0 0 2px
        rgba(0,0,0,.45),

        0 0 7px
        rgba(255,255,255,.15);
}


/* ==================================================
   VINYL ROTATION
================================================== */

@keyframes spin {

    from {
        transform:
            rotateX(18deg)
            rotateY(-20deg)
            rotateZ(-8deg);
    }

    to {
        transform:
            rotateX(18deg)
            rotateY(-20deg)
            rotateZ(352deg);
    }

}


/* ==================================================
   NOW PLAYING
================================================== */

.now-playing {
    margin-bottom:
        5px;
}

.now-playing h1 {
    margin:
        0;

    text-align:
        center;
}

.now-playing-label {
    margin-bottom:
        30px;

    margin-left:
        40%;

    font-family:
        "Spline Sans",
        sans-serif;

    font-size:
        12px;

    line-height:
        1;

    font-weight:
        700;

    letter-spacing:
        .20em;

    text-transform:
        uppercase;

    color:
        rgba(255,255,255,.46);
}


/* ==================================================
   SONG TITLE
   SORA 700
================================================== */

#title {
    margin:
        0;

    font-family:
        "Sora",
        Arial,
        sans-serif;

    font-size:
        clamp(
            38px,
            4.2vw,
            56px
        );

    line-height:
        1.08;

    font-weight:
        700;

    letter-spacing:
        -.03em;

    color:
        rgba(255,255,255,.96);

    text-shadow:
        0 3px 12px
        rgba(0,0,0,.50);

    transition:
        opacity .35s ease,
        transform .35s ease;
}


/* ==================================================
   LYRICS AREA
================================================== */

.lyrics-area {
    min-width:
        0;

    width:
        100%;

    display:
        flex;

    flex-direction:
        column;

    justify-content:
        center;
}


/* ==================================================
   LYRICS
================================================== */

#overlay {
    position: relative;

    width: 100%;

    opacity: 0;

    transition:
        opacity .5s ease;
}

#overlay.visible {
    opacity: 1;
}

#overlay.harmonizing {
    opacity: 0;
}


/* ==================================================
   LYRICS VIEWPORT
================================================== */

.roller-viewport {
    position: relative;

    width: 100%;

    height:
        320px;

    overflow:
        hidden;

    -webkit-mask-image:
        linear-gradient(
            to bottom,
            transparent 0%,
            black 30%,
            black 80%,
            transparent 100%
        );

    mask-image:
        linear-gradient(
            to bottom,
            transparent 0%,
            black 30%,
            black 80%,
            transparent 100%
        );
}

#lyrics {
    position: absolute;

    left: 0;
    right: 0;
    top: 0;

    transition:
        transform .65s
        cubic-bezier(
            .22,
            1,
            .36,
            1
        );
}


/* ==================================================
   LYRIC LINE
================================================== */

.lyric-line {
    height:
        64px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    padding:
        0 20px;

    font-family:
        "Spline Sans",
        Arial,
        sans-serif;

    font-size:
        29px;

    line-height:
        1.25;

    font-weight:
        700;

    color:
        rgba(255,255,255,.35);

    text-shadow:
        0 2px 6px
        rgba(0,0,0,.65);

    transform:
        none;
}

.lyric-line .wave-char {
    display:
        inline-block;

    position:
        relative;

    transform-origin:
        center center;

    will-change:
        transform;

    backface-visibility:
        hidden;

    -webkit-font-smoothing:
        antialiased;
}


/* ==================================================
   CURRENT LINE
================================================== */

.lyric-line.current {
    opacity:
        1;

    transform:
        none;

    font-family:
        "Spline Sans",
        Arial,
        sans-serif;

    font-size:
        30px;

    font-weight:
        700;

    color:
        white;

    text-shadow:
        0 2px 8px
        rgba(0,0,0,.75);
}

.lyric-line.current
.wave-char {
    color:
        white;

    -webkit-text-fill-color:
        white;
}


/* ==================================================
   CHARACTER WAVE
================================================== */

.lyric-line.current
.wave-char.wave-active {
    animation:
        smoothLetterWave
        .42s
        cubic-bezier(
            .25,
            .8,
            .25,
            1
        );
}

@keyframes smoothLetterWave {

    0% {
        transform:
            scale(1);
    }

    35% {
        transform:
            scale(1.35);
    }

    50% {
        transform:
            scale(1.42);
    }

    100% {
        transform:
            scale(1);
    }

}


/* ==================================================
   OTHER LINES
================================================== */

.lyric-line.prev-2 {
    opacity:
        .12;

    transform:
        none;
}

.lyric-line.prev-1 {
    opacity:
        .35;

    transform:
        none;
}

.lyric-line.next-1 {
    opacity:
        .40;

    transform:
        none;
}

.lyric-line.next-2 {
    opacity:
        .16;

    transform:
        none;
}


/* ==================================================
   LOADING
================================================== */

#loading {
    display:
        none;

    margin-top:
        8px;

    text-align:
        center;

    font-family:
        "Spline Sans",
        sans-serif;

    font-size:
        14px;

    color:
        rgba(255,255,255,.45);
}


/* ==================================================
   NO LYRICS
================================================== */

#noLyrics {
    display:
        none;

    text-align:
        center;

    font-family:
        "Spline Sans",
        sans-serif;

    font-size:
        20px;

    color:
        rgba(255,255,255,.5);
}


/* ==================================================
   SONG CHANGE
================================================== */

@keyframes songChange {

    0% {
        opacity:
            0;

        transform:
            translateY(15px);
    }

    100% {
        opacity:
            1;

        transform:
            translateY(0);
    }

}

.song-change {
    animation:
        songChange .7s
        cubic-bezier(
            .22,
            1,
            .36,
            1
        );
}


/* ==================================================
   MOBILE
================================================== */

@media (max-width: 800px) {

    .scene {
        display:
            flex;

        flex-direction:
            column;

        justify-content:
            flex-start;

        overflow-y:
            auto;

        gap:
            20px;

        width:
            100%;

        padding:
            16px;
    }

    .glass {
        width:
            95vw;

        min-height:
            250px;

        padding:
            42px 25px;

        border-radius:
            32px;
    }

    .content {
        min-height:
            250px;
    }

    .record {
        width:
            175px;
    }

    .vinyl-area {
        order:
            1;
    }

    .lyrics-area {
        width:
            95vw;

        order:
            2;
    }

    .now-playing {
        margin-bottom:
            20px;

        text-align:
            center;
    }

    .now-playing-label {
        margin-left:
            0;
    }

    #title {
        font-size:
            34px;
    }

    .lyric-line {
        font-size:
            22px;
    }

    .lyric-line.current {
        font-size:
            23px;
    }

}


/* ==================================================
   VERY SMALL SCREENS
================================================== */

@media (max-width: 500px) {

    .glass {
        padding:
            30px 18px;
    }

    .record {
        width:
            145px;
    }

    #title {
        font-size:
            28px;
    }

}

</style>

</head>


<body>

<div id="app">

    <div
        class="ambient"
        id="ambient"
    ></div>


    <main class="scene">

        <section class="glass">

            <div class="highlight"></div>


            <div class="content">


                <!-- ======================================
                     VINYL
                ======================================= -->

                <div class="vinyl-area">

                    <div
                        class="record"
                        id="record"
                    >

                        <div
                            class="album"
                            id="album"
                        >

                            <img
                                id="albumArt"
                                alt=""
                            >

                        </div>


                        <div class="hole"></div>

                    </div>

                </div>


                <!-- ======================================
                     LYRICS SIDE
                ======================================= -->

                <div class="lyrics-area">


                    <!-- ==================================
                         NOW PLAYING
                    =================================== -->

                    <div class="now-playing">

                        <div
                            class="now-playing-label"
                        >
                            -- Now Playing --
                        </div>


                        <h1 id="title">
                            Waiting for Spotify...
                        </h1>

                    </div>


                    <!-- ==================================
                         LYRICS
                    =================================== -->

                    <div id="overlay">

                        <div class="roller-viewport">

                            <div id="lyrics"></div>

                        </div>


                        <div id="loading">
                            Loading lyrics...
                        </div>


                        <div id="noLyrics">
                            Lyrics unavailable
                        </div>

                    </div>

                </div>

            </div>

        </section>

    </main>

</div>


<script>

/* ==================================================
   STATE
================================================== */

let currentTrackId =
    null;

let currentLyrics =
    [];

let lineElements =
    [];

let lastServerPosition =
    0;

let lastServerSyncTime =
    0;

let lastLyricIndex =
    undefined;

let lyricsRequestTrack =
    null;

let harmonizing =
    false;

let lastTransition =
    null;

let currentAlbumArt =
    null;


/* ==================================================
   SETTINGS
================================================== */

const ROW_HEIGHT =
    64;

const WAVE_DURATION =
    420;

const WAVE_DELAY =
    70;

const WAVE_PAUSE =
    500;

const WAVE_DELAY_MIN =
    25;

const WAVE_DELAY_MAX =
    100;

const HARMONIZE_HIDE_TIME =
    900;


/* ==================================================
   ELEMENTS
================================================== */

const overlay =
    document.getElementById(
        "overlay"
    );

const titleElement =
    document.getElementById(
        "title"
    );

const lyricsElement =
    document.getElementById(
        "lyrics"
    );

const loadingElement =
    document.getElementById(
        "loading"
    );

const noLyricsElement =
    document.getElementById(
        "noLyrics"
    );

const albumArtElement =
    document.getElementById(
        "albumArt"
    );

const ambientElement =
    document.getElementById(
        "ambient"
    );


/* ==================================================
   DEFAULT AMBIENT
================================================== */

function setDefaultAmbient() {

    document.documentElement.style.setProperty(
        "--ambient-color-soft",
        "rgba(95, 105, 125, .12)"
    );

    document.documentElement.style.setProperty(
        "--ambient-color-faint",
        "rgba(75, 85, 105, .08)"
    );

    document.documentElement.style.setProperty(
        "--ambient-color-center",
        "rgba(100, 110, 130, .05)"
    );

    document.documentElement.style.setProperty(
        "--ambient-color-glass",
        "rgba(90, 100, 120, .10)"
    );

    document.documentElement.style.setProperty(
        "--ambient-color-art",
        "rgba(100, 110, 130, .12)"
    );


    /*
     * Default glass colors.
     */
    document.documentElement.style.setProperty(
        "--glass-color-primary",
        "rgba(12, 13, 17, .32)"
    );

    document.documentElement.style.setProperty(
        "--glass-color-secondary",
        "rgba(12, 13, 17, .22)"
    );


    /*
     * Default border.
     */
    document.documentElement.style.setProperty(
        "--glass-border-color",
        "rgba(255, 255, 255, .075)"
    );


    /*
     * Default trace.
     */
    document.documentElement.style.setProperty(
        "--glass-trace-soft",
        "rgba(255, 255, 255, .08)"
    );

    document.documentElement.style.setProperty(
        "--glass-trace-medium",
        "rgba(255, 255, 255, .22)"
    );

    document.documentElement.style.setProperty(
        "--glass-trace-bright",
        "rgba(255, 255, 255, .55)"
    );

    document.documentElement.style.setProperty(
        "--glass-trace-glow",
        "rgba(255, 255, 255, .25)"
    );

    document.documentElement.style.setProperty(
        "--glass-outer-glow",
        "rgba(255, 255, 255, .015)"
    );
}

setDefaultAmbient();


/* ==================================================
   ALBUM COLOR
================================================== */

function updateAmbientFromImage(
    image
) {

    try {

        const canvas =
            document.createElement(
                "canvas"
            );

        const context =
            canvas.getContext(
                "2d",
                {
                    willReadFrequently:
                        true
                }
            );

        const sampleSize =
            32;

        canvas.width =
            sampleSize;

        canvas.height =
            sampleSize;


        context.drawImage(
            image,
            0,
            0,
            sampleSize,
            sampleSize
        );


        const pixels =
            context.getImageData(
                0,
                0,
                sampleSize,
                sampleSize
            ).data;


        let red =
            0;

        let green =
            0;

        let blue =
            0;

        let count =
            0;


        for (
            let i = 0;
            i < pixels.length;
            i += 4
        ) {

            const r =
                pixels[i];

            const g =
                pixels[i + 1];

            const b =
                pixels[i + 2];

            const alpha =
                pixels[i + 3];


            if (
                alpha < 40
            ) {
                continue;
            }


            const brightness =
                (
                    r +
                    g +
                    b
                ) / 3;


            if (
                brightness < 18
            ) {
                continue;
            }


            red +=
                r;

            green +=
                g;

            blue +=
                b;

            count++;
        }


        if (
            count === 0
        ) {

            setDefaultAmbient();

            return;
        }


        red =
            Math.round(
                red / count
            );

        green =
            Math.round(
                green / count
            );

        blue =
            Math.round(
                blue / count
            );


        const hsl =
            rgbToHsl(
                red,
                green,
                blue
            );


        /*
         * ==========================================
         * SAFE ALBUM COLOR
         * ==========================================
         *
         * Keep the background restrained.
         *
         * Saturation:
         * 18% → 38%
         *
         * Lightness:
         * 22% → 36%
         */

        const safeSaturation =
            Math.min(
                Math.max(
                    hsl.s,
                    18
                ),
                38
            );


        const safeLightness =
            Math.min(
                Math.max(
                    hsl.l,
                    22
                ),
                36
            );


        const safeColor =
            `hsl(${hsl.h} ${safeSaturation}% ${safeLightness}%)`;


        /* ==================================================
           AMBIENT COLORS
        ================================================== */

        const softColor =
            `hsla(${hsl.h}, ${safeSaturation}%, ${safeLightness}%, .105)`;


        const faintColor =
            `hsla(${hsl.h}, ${safeSaturation}%, ${safeLightness}%, .055)`;


        const centerColor =
            `hsla(${hsl.h}, ${safeSaturation}%, ${safeLightness}%, .035)`;


        const glassColor =
            `hsla(${hsl.h}, ${safeSaturation}%, ${safeLightness}%, .065)`;


        const artColor =
            `hsla(${hsl.h}, ${safeSaturation}%, ${safeLightness + 3}%, .17)`;


        document.documentElement.style.setProperty(
            "--ambient-color-soft",
            softColor
        );

        document.documentElement.style.setProperty(
            "--ambient-color-faint",
            faintColor
        );

        document.documentElement.style.setProperty(
            "--ambient-color-center",
            centerColor
        );

        document.documentElement.style.setProperty(
            "--ambient-color-glass",
            glassColor
        );

        document.documentElement.style.setProperty(
            "--ambient-color-art",
            artColor
        );


        /* ==================================================
           GLASS COLOR
        ================================================== */

        /*
         * Very dark album-colored glass.
         *
         * The color is intentionally kept dark
         * so the lyrics remain the visual focus.
         */

        const glassPrimary =
            `hsla(${hsl.h}, ${safeSaturation}%, 9%, .72)`;


        const glassSecondary =
            `hsla(${hsl.h}, ${safeSaturation}%, 5%, .84)`;


        document.documentElement.style.setProperty(
            "--glass-color-primary",
            glassPrimary
        );

        document.documentElement.style.setProperty(
            "--glass-color-secondary",
            glassSecondary
        );


        /* ==================================================
           GLASS BORDER COLOR
        ================================================== */

        /*
         * The static border receives a subtle version
         * of the album color.
         */

        const glassBorderColor =
            `hsla(${hsl.h}, ${safeSaturation}%, 62%, .16)`;


        document.documentElement.style.setProperty(
            "--glass-border-color",
            glassBorderColor
        );


        /* ==================================================
           TRAVELING BORDER TRACE
        ================================================== */

        /*
         * Soft colored part of the trace.
         */

        const traceSoft =
            `hsla(${hsl.h}, ${safeSaturation}%, 60%, .10)`;


        /*
         * Main colored part.
         */

        const traceMedium =
            `hsla(${hsl.h}, ${safeSaturation}%, 68%, .38)`;


        /*
         * Bright leading section.
         */

        const traceBright =
            `hsla(${hsl.h}, ${safeSaturation}%, 78%, .82)`;


        /*
         * Glow surrounding the trace.
         */

        const traceGlow =
            `hsla(${hsl.h}, ${safeSaturation}%, 65%, .42)`;


        document.documentElement.style.setProperty(
            "--glass-trace-soft",
            traceSoft
        );

        document.documentElement.style.setProperty(
            "--glass-trace-medium",
            traceMedium
        );

        document.documentElement.style.setProperty(
            "--glass-trace-bright",
            traceBright
        );

        document.documentElement.style.setProperty(
            "--glass-trace-glow",
            traceGlow
        );


        /* ==================================================
           OUTER GLASS GLOW
        ================================================== */

        const outerGlow =
            `hsla(${hsl.h}, ${safeSaturation}%, 35%, .055)`;


        document.documentElement.style.setProperty(
            "--glass-outer-glow",
            outerGlow
        );


        console.log(
            "Album color:",
            safeColor
        );

    }

    catch (error) {

        /*
         * IMPORTANT:
         *
         * A canvas/CORS failure must NOT
         * prevent album artwork from displaying.
         *
         * We simply keep the previous/default
         * ambient and glass colors.
         */

        console.warn(
            "Could not extract album color:",
            error.message
        );
    }
}


/* ==================================================
   RGB → HSL
================================================== */

function rgbToHsl(
    r,
    g,
    b
) {

    r /= 255;
    g /= 255;
    b /= 255;


    const max =
        Math.max(
            r,
            g,
            b
        );


    const min =
        Math.min(
            r,
            g,
            b
        );


    let h =
        0;

    let s =
        0;


    const l =
        (
            max +
            min
        ) / 2;


    if (
        max !== min
    ) {

        const d =
            max -
            min;


        s =
            l > .5
                ? d /
                    (
                        2 -
                        max -
                        min
                    )
                : d /
                    (
                        max +
                        min
                    );


        switch (
            max
        ) {

            case r:

                h =
                    (
                        g -
                        b
                    ) / d +
                    (
                        g < b
                            ? 6
                            : 0
                    );

                break;


            case g:

                h =
                    (
                        b -
                        r
                    ) / d +
                    2;

                break;


            case b:

                h =
                    (
                        r -
                        g
                    ) / d +
                    4;

                break;
        }


        h /=
            6;
    }


    return {

        h:
            Math.round(
                h * 360
            ),

        s:
            Math.round(
                s * 100
            ),

        l:
            Math.round(
                l * 100
            )
    };
}


/* ==================================================
   LOAD ALBUM ART
================================================== */

function loadAlbumArt(
    url
) {

    if (
        !url
    ) {

        albumArtElement.classList.remove(
            "loaded"
        );

        albumArtElement.removeAttribute(
            "src"
        );

        currentAlbumArt =
            null;

        setDefaultAmbient();

        return;
    }


    if (
        currentAlbumArt ===
        url
    ) {
        return;
    }


    currentAlbumArt =
        url;


    /*
     * ==============================================
     * IMPORTANT ALBUM ART FIX
     * ==============================================
     *
     * Set the visible image FIRST.
     *
     * Do not wait for canvas color extraction.
     *
     * This guarantees the Spotify artwork
     * appears even if Spotify's CDN does not
     * allow canvas pixel access.
     */

    albumArtElement.classList.remove(
        "loaded"
    );


    albumArtElement.src =
        url;


    albumArtElement.onload =
        () => {

            albumArtElement.classList.add(
                "loaded"
            );
        };


    albumArtElement.onerror =
        () => {

            console.warn(
                "Album artwork could not be loaded:",
                url
            );

            albumArtElement.classList.remove(
                "loaded"
            );
        };


    /*
     * ==============================================
     * COLOR EXTRACTION
     * ==============================================
     *
     * This is completely separate from
     * displaying the artwork.
     */

    const image =
        new Image();


    image.crossOrigin =
        "anonymous";


    image.onload =
        () => {

            updateAmbientFromImage(
                image
            );
        };


    image.onerror =
        () => {

            console.warn(
                "Could not load album image for color extraction."
            );
        };


    image.src =
        url;
}


/* ==================================================
   GET SERVER PLAYBACK
================================================== */

async function getSpotify() {

    try {

        const response =
            await fetch(
                "/api/current?ts=" +
                Date.now(),
                {
                    cache:
                        "no-store"
                }
            );


        if (
            !response.ok
        ) {
            return null;
        }


        return await response.json();

    }

    catch (error) {

        console.error(
            "Server playback request failed:",
            error
        );

        return null;
    }
}


/* ==================================================
   GET LYRICS
================================================== */

async function getLyrics(
    track
) {

    if (
        !track
    ) {
        return;
    }


    if (
        lyricsRequestTrack ===
        track.id
    ) {
        return;
    }


    lyricsRequestTrack =
        track.id;


    loadingElement.style.display =
        "block";

    noLyricsElement.style.display =
        "none";


    lyricsElement.innerHTML =
        "";

    lineElements =
        [];

    currentLyrics =
        [];


    try {

        const params =
            new URLSearchParams({

                id:
                    track.id,

                title:
                    track.title,

                artist:
                    track.artist,

                album:
                    track.album || "",

                duration:
                    track.duration

            });


        const response =
            await fetch(
                "/api/lyrics?" +
                params.toString(),
                {
                    cache:
                        "no-store"
                }
            );


        if (
            !response.ok
        ) {

            throw new Error(
                "Lyrics request failed"
            );
        }


        const data =
            await response.json();


        loadingElement.style.display =
            "none";


        if (
            data.syncedLyrics
        ) {

            currentLyrics =
                parseSyncedLyrics(
                    data.syncedLyrics
                );
        }


        if (
            currentLyrics.length === 0 &&
            data.lyrics
        ) {

            currentLyrics =
                parsePlainLyrics(
                    data.lyrics
                );
        }


        if (
            currentLyrics.length === 0
        ) {

            noLyricsElement.style.display =
                "block";

            return;
        }


        buildLyricRows();


        lastLyricIndex =
            undefined;


        updateLyrics(
            getEstimatedPosition()
        );

    }

    catch (error) {

        console.error(
            "Lyrics error:",
            error
        );

        loadingElement.style.display =
            "none";

        noLyricsElement.style.display =
            "block";
    }
}


/* ==================================================
   PARSE SYNCED LYRICS
================================================== */

function parseSyncedLyrics(
    text
) {

    const lines =
        text.split(
            /\r?\n/
        );


    const result =
        [];


    for (
        const line of lines
    ) {

        const match =
            line.match(
                /^\[(\d+):(\d+(?:\.\d+)?)\]\s*(.*)$/
            );


        if (
            !match
        ) {
            continue;
        }


        const minutes =
            Number(
                match[1]
            );


        const seconds =
            Number(
                match[2]
            );


        const timestamp =
            (
                minutes * 60 +
                seconds
            ) * 1000;


        const lyric =
            match[3].trim();


        if (
            !lyric
        ) {
            continue;
        }


        result.push({

            time:
                timestamp,

            text:
                lyric

        });
    }


    return result.sort(
        (
            a,
            b
        ) =>
            a.time -
            b.time
    );
}


/* ==================================================
   PLAIN LYRICS
================================================== */

function parsePlainLyrics(
    text
) {

    const lines =
        text.split(
            /\r?\n/
        );


    return lines

        .map(
            (
                line,
                index
            ) => ({

                time:
                    index * 4000,

                text:
                    line.trim()

            })
        )

        .filter(
            line =>
                line.text.length > 0
        );
}


/* ==================================================
   CURRENT LYRIC
================================================== */

function getCurrentLyricIndex(
    position
) {

    if (
        currentLyrics.length === 0
    ) {
        return -1;
    }


    let currentIndex =
        -1;


    for (
        let i = 0;
        i < currentLyrics.length;
        i++
    ) {

        if (
            position >=
            currentLyrics[i].time
        ) {

            currentIndex =
                i;

        }

        else {
            break;
        }
    }


    return currentIndex;
}


/* ==================================================
   LINE CLASSIFICATION
================================================== */

function classifyLine(
    index,
    currentIndex
) {

    const diff =
        index -
        currentIndex;


    if (
        diff === 0
    ) {
        return "current";
    }


    if (
        diff === -1
    ) {
        return "prev-1";
    }


    if (
        diff <= -2
    ) {
        return "prev-2";
    }


    if (
        diff === 1
    ) {
        return "next-1";
    }


    return "next-2";
}


/* ==================================================
   BUILD LYRIC ROWS
================================================== */

function buildLyricRows() {

    lyricsElement.innerHTML =
        "";


    lineElements =
        currentLyrics.map(
            line => {

                const element =
                    document.createElement(
                        "div"
                    );


                element.className =
                    "lyric-line";


                [
                    ...line.text
                ].forEach(
                    char => {

                        const span =
                            document.createElement(
                                "span"
                            );


                        span.className =
                            "wave-char";


                        span.textContent =
                            char === " "
                                ? "\u00A0"
                                : char;


                        element.appendChild(
                            span
                        );
                    }
                );


                lyricsElement.appendChild(
                    element
                );


                return element;
            }
        );
}


/* ==================================================
   WAVE
================================================== */

let waveToken =
    0;


function sleep(
    milliseconds
) {

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                milliseconds
            )
    );
}


/* ==================================================
   CHARACTER WAVE
================================================== */

async function runCharacterWave(
    lyricElement,
    letterDelay,
    token
) {

    if (
        !letterDelay
    ) {

        letterDelay =
            WAVE_DELAY;
    }


    if (
        !lyricElement
    ) {
        return;
    }


    if (
        token !==
        waveToken
    ) {
        return;
    }


    const characters =
        lyricElement.querySelectorAll(
            ".wave-char"
        );


    characters.forEach(
        character => {

            character.classList.remove(
                "wave-active"
            );
        }
    );


    await sleep(
        50
    );


    if (
        token !==
        waveToken
    ) {
        return;
    }


    for (
        let i = 0;
        i < characters.length;
        i++
    ) {

        if (
            token !==
            waveToken
        ) {
            return;
        }


        if (
            harmonizing
        ) {
            return;
        }


        const character =
            characters[i];


        character.classList.remove(
            "wave-active"
        );


        void character.offsetWidth;


        character.classList.add(
            "wave-active"
        );


        await sleep(
            letterDelay
        );
    }


    await sleep(
        WAVE_DURATION
    );


    if (
        token !==
        waveToken
    ) {
        return;
    }


    await sleep(
        WAVE_PAUSE
    );


    if (
        token !==
        waveToken
    ) {
        return;
    }


    runCharacterWave(
        lyricElement,
        letterDelay,
        token
    );
}


/* ==================================================
   LINE DURATION
================================================== */

function getLineDuration(
    index
) {

    const line =
        currentLyrics[index];


    const next =
        currentLyrics[index + 1];


    if (
        !line ||
        !next
    ) {
        return 3000;
    }


    const diff =
        next.time -
        line.time;


    if (
        diff <= 0
    ) {
        return 3000;
    }


    return Math.min(
        Math.max(
            diff,
            800
        ),
        8000
    );
}


/* ==================================================
   WAVE DELAY
================================================== */

function getWaveDelayForLine(
    text,
    duration
) {

    const charCount =
        [...text].length ||
        1;


    const available =
        Math.max(
            duration -
            WAVE_DURATION -
            200,
            400
        );


    const delay =
        available /
        charCount;


    return Math.min(
        Math.max(
            delay,
            WAVE_DELAY_MIN
        ),
        WAVE_DELAY_MAX
    );
}


/* ==================================================
   RENDER LYRICS
================================================== */

function renderLyrics(
    currentIndex
) {

    if (
        lineElements.length === 0
    ) {
        return;
    }


    for (
        let i = 0;
        i < lineElements.length;
        i++
    ) {

        const element =
            lineElements[i];


        const tier =
            classifyLine(
                i,
                currentIndex
            );


        element.className =
            "lyric-line " +
            tier;
    }


    if (
        currentIndex < 0
    ) {
        return;
    }


    const viewport =
        lyricsElement.parentElement;


    const viewportHeight =
        viewport.clientHeight;


    const centerOffset =
        (
            viewportHeight / 2
        ) -
        (
            ROW_HEIGHT / 2
        );


    const trackOffset =
        centerOffset -
        (
            currentIndex *
            ROW_HEIGHT
        );


    lyricsElement.style.transform =
        "translate3d(0, " +
        trackOffset +
        "px, 0)";


    const currentElement =
        lineElements[
            currentIndex
        ];


    if (
        currentElement &&
        !harmonizing
    ) {

        const duration =
            getLineDuration(
                currentIndex
            );


        const letterDelay =
            getWaveDelayForLine(
                currentLyrics[
                    currentIndex
                ].text,
                duration
            );


        waveToken++;


        runCharacterWave(
            currentElement,
            letterDelay,
            waveToken
        );
    }
}


/* ==================================================
   UPDATE LYRICS
================================================== */

function updateLyrics(
    position
) {

    if (
        currentLyrics.length === 0 ||
        harmonizing
    ) {
        return;
    }


    const currentIndex =
        getCurrentLyricIndex(
            position
        );


    if (
        currentIndex !==
        lastLyricIndex
    ) {

        lastLyricIndex =
            currentIndex;


        renderLyrics(
            currentIndex
        );
    }
}


/* ==================================================
   ESTIMATED POSITION
================================================== */

function getEstimatedPosition() {

    if (
        !lastServerSyncTime
    ) {
        return lastServerPosition;
    }


    const elapsed =
        performance.now() -
        lastServerSyncTime;


    return (
        lastServerPosition +
        elapsed
    );
}


/* ==================================================
   HARMONIZE
================================================== */

async function harmonize(
    transition
) {

    harmonizing =
        true;


    waveToken++;


    overlay.classList.add(
        "harmonizing"
    );


    await sleep(
        HARMONIZE_HIDE_TIME
    );


    if (
        lastTransition ===
        transition
    ) {

        harmonizing =
            false;


        overlay.classList.remove(
            "harmonizing"
        );


        lastLyricIndex =
            undefined;


        updateLyrics(
            getEstimatedPosition()
        );
    }
}


/* ==================================================
   UPDATE SPOTIFY
================================================== */

async function updateSpotify() {

    const track =
        await getSpotify();


    if (
        !track
    ) {
        return;
    }


    lastServerPosition =
        Number(
            track.position
        ) || 0;


    lastServerSyncTime =
        performance.now();


    /* ==========================================
       STOPPED
    ========================================== */

    if (
        !track.playing &&
        !track.id
    ) {

        harmonizing =
            false;


        overlay.classList.remove(
            "visible"
        );


        overlay.classList.remove(
            "harmonizing"
        );


        setDefaultAmbient();


        titleElement.textContent =
            "Waiting for Spotify...";


        albumArtElement.classList.remove(
            "loaded"
        );


        albumArtElement.removeAttribute(
            "src"
        );


        currentAlbumArt =
            null;


        return;
    }


    /* ==========================================
       NEW TRACK
    ========================================== */

    if (
        currentTrackId !==
        track.id
    ) {

        console.log(
            "New Spotify track:",
            track.title,
            "-",
            track.artist
        );


        waveToken++;


        harmonizing =
            false;


        overlay.classList.remove(
            "harmonizing"
        );


        currentTrackId =
            track.id;


        lyricsRequestTrack =
            null;


        currentLyrics =
            [];


        lineElements =
            [];


        lastLyricIndex =
            undefined;


        lyricsElement.innerHTML =
            "";


        /* ======================================
           TITLE
        ====================================== */

        titleElement.classList.remove(
            "song-change"
        );


        void titleElement.offsetWidth;


        titleElement.textContent =
            track.title;


        titleElement.classList.add(
            "song-change"
        );


        /* ======================================
           ALBUM ART
        ====================================== */

        loadAlbumArt(
            track.albumArt
        );


        /* ======================================
           LYRICS
        ====================================== */

        await getLyrics(
            track
        );
    }


    /* ==========================================
       TRANSITION
    ========================================== */

    const transition =
        track.transition;


    if (
        transition &&
        transition !==
        lastTransition
    ) {

        lastTransition =
            transition;


        if (
            transition ===
            "PAUSED"
        ) {

            harmonizing =
                false;


            waveToken++;


            overlay.classList.remove(
                "visible"
            );


            overlay.classList.remove(
                "harmonizing"
            );


            return;
        }


        if (
            transition ===
            "RESUMED"
        ) {

            harmonizing =
                false;


            overlay.classList.add(
                "visible"
            );


            lastLyricIndex =
                undefined;


            updateLyrics(
                getEstimatedPosition()
            );


            return;
        }


        if (
            transition ===
            "FAST_FORWARD"
        ) {

            await harmonize(
                "FAST_FORWARD"
            );


            return;
        }


        if (
            transition ===
            "REWIND"
        ) {

            await harmonize(
                "REWIND"
            );


            return;
        }


        if (
            transition ===
            "TRACK_CHANGED"
        ) {

            harmonizing =
                false;


            overlay.classList.remove(
                "harmonizing"
            );


            overlay.classList.add(
                "visible"
            );


            lastLyricIndex =
                undefined;


            updateLyrics(
                getEstimatedPosition()
            );
        }
    }


    /* ==========================================
       NORMAL PLAYING
    ========================================== */

    if (
        track.playing
    ) {

        harmonizing =
            false;


        overlay.classList.remove(
            "harmonizing"
        );


        overlay.classList.add(
            "visible"
        );


        updateLyrics(
            getEstimatedPosition()
        );


        return;
    }


    /* ==========================================
       PAUSED
    ========================================== */

    harmonizing =
        false;


    waveToken++;


    overlay.classList.remove(
        "visible"
    );


    overlay.classList.remove(
        "harmonizing"
    );
}


/* ==================================================
   INITIAL LOAD
================================================== */

updateSpotify();


/* ==================================================
   SERVER SYNC
================================================== */

setInterval(
    updateSpotify,
    2000
);


/* ==================================================
   SMOOTH LYRIC CLOCK
================================================== */

function smoothUpdate() {

    if (
        currentTrackId &&
        currentLyrics.length > 0 &&
        !harmonizing
    ) {

        updateLyrics(
            getEstimatedPosition()
        );
    }


    requestAnimationFrame(
        smoothUpdate
    );
}


requestAnimationFrame(
    smoothUpdate
);

</script>
